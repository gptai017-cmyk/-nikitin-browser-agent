name: Yandzeen Daily Audience Count
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/yandzeen-metrics.yml"
  schedule:
    - cron: "45 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yandzeen-daily-metrics
  cancel-in-progress: false

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read Telegram member count
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node zen/scripts/metrics.mjs
      - name: Save daily count
        run: |
          if ! git diff --quiet -- zen/metrics/history.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add zen/metrics/history.json
            git commit -m "Update @yandzeen audience count"
            git pull --rebase
            git push
          fi
