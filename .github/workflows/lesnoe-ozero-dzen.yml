name: Yandzeen Editorial Publisher
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lesnoe-ozero-dzen.yml"
      - "zen/content/calendar.json"
      - "zen/scripts/publish.mjs"
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:
    inputs:
      article_date:
        description: "Optional YYYY-MM-DD date (only due unpublished articles)"
        required: false
        type: string
      dry_run:
        description: "Only preview the article"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: yandzeen-publisher-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Publish next due Telegram post when admin permission exists
        env:
          ARTICLE_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.article_date || '' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node zen/scripts/publish.mjs
      - name: Persist delivered message ID
        shell: bash
        run: |
          if ! git diff --quiet -- zen/state/published.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add zen/state/published.json
            git commit -m "Record Telegram delivery for @yandzeen"
            git pull --rebase
            git push
          fi
