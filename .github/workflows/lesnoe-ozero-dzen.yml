name: Lesnoe Ozero - Dzen via Telegram
on:
  workflow_dispatch:
    inputs:
      article_date:
        description: "Publication date YYYY-MM-DD (Moscow time); empty = today"
        required: false
        type: string
      dry_run:
        description: "Preview only; do not publish"
        required: true
        type: boolean
        default: true
  schedule:
    - cron: "37 6 * * *"

permissions:
  contents: write

concurrency:
  group: lesnoe-ozero-dzen-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # SAFE: scheduled events preview only until Dzen sync has been verified.
      - name: Preview or publish scheduled article
        env:
          ARTICLE_DATE: ${{ inputs.article_date }}
          DRY_RUN: ${{ github.event_name == 'schedule' || inputs.dry_run }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          LEO_TELEGRAM_CHANNEL: ${{ vars.LEO_TELEGRAM_CHANNEL }}
        run: node zen/scripts/publish.mjs
      - name: Record completed publication
        run: |
          if ! git diff --quiet -- zen/state/published.json; then
            git config user.name "lesnoe-ozero-publisher[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add zen/state/published.json
            git commit -m "Record Lesnoe Ozero publication"
            git push
          fi
