name: Guard Telegram Lex doc subscription fail-closed
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/guard-telegram-lex-doc-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lex-telegram-production-patch
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT: ead717e4aeccf34fc50aa3832f12221f
      NAME: cbd-legal-advokat4u
    steps:
      - uses: actions/checkout@v4
      - name: Verify patch and subscriber scenarios without tokens
        run: |
          set -euo pipefail
          node --check src/telegram-gate-failclosed-patch.mjs
          node pravo4u-checkout/telegram-gate-failclosed.test.mjs
      - name: Read live Telegram source and patch in isolated runner
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN"
          base="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/$NAME"
          curl -fsS --max-time 40 -H "Authorization: Bearer $CF_API_TOKEN" "$base" -o /tmp/lex-tg-live
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const b=fs.readFileSync('/tmp/lex-tg-live','utf8');
          const boundary=b.split(/\r?\n/,1)[0];
          const marker='Content-Disposition: form-data; name="index.js"\r\n\r\n';
          const start=b.indexOf(marker)+marker.length;
          if(start<marker.length||!boundary)throw Error('Unexpected production bundle');
          const stop=b.indexOf('\r\n'+boundary,start);
          if(stop<0)throw Error('Production bundle truncated');
          const original=b.slice(start,stop);
          if(original.length<1000000||!original.includes('var VERSION = "2.2.2";'))throw Error('Refusing unexpected Telegram version');
          fs.writeFileSync('/tmp/lex-tg-before.js',original,{mode:0o600});
          const {patchTelegramGate}=await import('./src/telegram-gate-failclosed-patch.mjs');
          const mark='/* LEX_DOC_GATE_FAIL_CLOSED_2026_11_03 */';
          const exists=original.includes(mark);
          if(exists && (original.split(mark).length!==2||original.includes('} catch(e) {console.warn("lex_channel_member_check_unavailable");}')))
            throw Error('Partial or inconsistent prior patch');
          const after=exists?original:patchTelegramGate(original);
          fs.writeFileSync('/tmp/lex-tg-after.js',after,{mode:0o600});
          fs.writeFileSync('/tmp/patch-needed',exists?'false':'true');
          console.log('Telegram gated build validated; patch_needed='+(!exists)+'. Source and keys not printed.');
          NODE
          node --check /tmp/lex-tg-after.js
      - name: Publish guarded content-only change, read back, roll back on failure
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/$NAME"
          put() {
            local file="$1"
            status=$(curl -sS --max-time 75 -w '%{http_code}' -X PUT "$base/content" \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -F 'metadata={"main_module":"index.js"};type=application/json' \
              -F "index.js=@$file;filename=index.js;type=application/javascript+module" \
              -o /tmp/lex-tg-response.json)
            if [ "$status" != "200" ] || ! jq -e '.success == true' /tmp/lex-tg-response.json >/dev/null; then
              echo "Telegram content update rejected: HTTP=$status"
              jq -c '[.errors[]? | {code,message}]' /tmp/lex-tg-response.json || true
              return 1
            fi
          }
          if [ "$(cat /tmp/patch-needed)" = "true" ]; then
            put /tmp/lex-tg-after.js
          fi
          verify() {
            curl -fsS --max-time 35 -H "Authorization: Bearer $CF_API_TOKEN" "$base" -o /tmp/lex-tg-verify
            node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const b=fs.readFileSync('/tmp/lex-tg-verify','utf8');
          const boundary=b.split(/\r?\n/,1)[0];
          const marker='Content-Disposition: form-data; name="index.js"\r\n\r\n';
          const start=b.indexOf(marker)+marker.length;
          const end=b.indexOf('\r\n'+boundary,start);
          if(start<marker.length||end<0)throw Error('Invalid Cloudflare readback');
          const live=b.slice(start,end);
          const expected=fs.readFileSync('/tmp/lex-tg-after.js','utf8');
          for(const m of ['LEX_DOC_GATE_FAIL_CLOSED_2026_11_03','LEX_DOC_CHANNEL_GATE_2026_11_02','PRAVO4U_LEX_REALTY_CATALOG_2026_10_28']){
            if(live.split(m).length!==2)throw Error('Missing protected gate marker');
          }
          if(live.includes('} catch(e) {console.warn("lex_channel_member_check_unavailable");}'))throw Error('Fail-open fallback survived');
          const digest=x=>createHash('sha256').update(x).digest('hex');
          if(digest(live)!==digest(expected))throw Error('Live readback differs from uploaded module');
          console.log('TG_GATE_FAIL_CLOSED=true; backend readback, markers and checksum OK.');
          NODE
          }
          if ! verify; then
            if [ "$(cat /tmp/patch-needed)" = "true" ]; then
              echo 'Verification failed; attempting original content rollback'
              put /tmp/lex-tg-before.js || true
            fi
            exit 1
          fi
