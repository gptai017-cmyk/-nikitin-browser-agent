name: FPG Options Audit
on:
  push:
    branches: [main]
    paths: [".github/workflows/fpg-options-audit.yml"]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: "npm"}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Inspect FPG dropdown options
        env:
          FPG_LOGIN: ${{ secrets.FPG_LOGIN }}
          FPG_PASSWORD: ${{ secrets.FPG_PASSWORD }}
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";
          const u="https://xn--80afcdbalict6afooklqi5o.xn--p1ai/application/about-project?applicationId=8546be37-971f-4a0f-ba12-af9876ee6d0f";
          const browser=await chromium.launch({headless:true}); const page=await browser.newPage({locale:"ru-RU"});
          async function nav(){try{await page.goto(u,{waitUntil:"commit",timeout:30000})}catch{} await page.waitForTimeout(2500);}
          await nav();
          const pw=page.locator('input[type="password"]').first();
          if(await pw.count()){
            const login=page.locator('input[type="email"],input[name*="login" i],input[name*="email" i],input[type="text"]').first();
            await login.fill(process.env.FPG_LOGIN||""); await pw.fill(process.env.FPG_PASSWORD||"");
            const b=page.getByRole('button',{name:/войти|вход/i}).first();
            if(await b.count()) await b.click(); else await page.locator('button[type="submit"]').first().click();
            await page.waitForTimeout(3500); await nav();
          }
          const sels=page.locator('ng-select,.ng-select');
          const count=await sels.count();
          const out=[];
          for(let i=0;i<count;i++){
            const s=sels.nth(i);
            if(!(await s.isVisible().catch(()=>false))) continue;
            const display=String(await s.innerText().catch(()=>"")).replace(/\s+/g," ").trim();
            try{await s.click({force:true}); await page.waitForTimeout(350);}catch{}
            const opts=await page.locator(".ng-dropdown-panel .ng-option:visible,[role='option']:visible").allInnerTexts().catch(()=>[]);
            out.push({i,display,options:opts.map(x=>String(x).replace(/\s+/g," ").trim()).filter(Boolean).slice(0,80)});
            await page.keyboard.press("Escape").catch(()=>{}); await page.waitForTimeout(150);
          }
          console.log("FPG_OPTIONS_JSON "+JSON.stringify(out));
          await browser.close();
          NODE
