name: PAYCOIN first audience poll and baseline metrics
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/paycoin-growth-kickoff.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: paycoin-assistant-deploy
  cancel-in-progress: false
jobs:
  kickoff:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ead717e4aeccf34fc50aa3832f12221f
    steps:
      - uses: actions/checkout@v4
      - name: Install Worker CLI
        working-directory: paycoin-assistant
        run: npm install --no-audit --no-fund
      - name: Prepare temporary private verification credential
        working-directory: paycoin-assistant
        shell: bash
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          printf '%s' "$token" | npx wrangler secret put VERIFY_TOKEN --name paycoin-assistant >/dev/null
          echo "SECRET=$token" >> "$GITHUB_ENV"
      - name: Post audience poll and introduce discussion rules once
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://paycoin-assistant.cbd-legal-cloudflare-worker.workers.dev/internal/growth-launch"
          for attempt in 1 2 3 4 5; do
            code="$(curl --max-time 25 -sS -X POST -o /tmp/paycoin-growth.json -w '%{http_code}' -H "Authorization: Bearer $SECRET" "$endpoint")"
            if [ "$code" = "200" ] && jq -e '.ok == true' /tmp/paycoin-growth.json >/dev/null; then
              jq '{ok,poll,groupGuide,botProfileUpdated}' /tmp/paycoin-growth.json
              exit 0
            fi
            echo "Growth attempt $attempt HTTP $code"
            if [ "$code" != "401" ] && [ "$code" != "404" ] && [ "$code" != "502" ]; then break; fi
            sleep 5
          done
          jq '{ok,code,detail}' /tmp/paycoin-growth.json || true
          exit 1
      - name: Save baseline channel and group counts
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://paycoin-assistant.cbd-legal-cloudflare-worker.workers.dev/internal/metrics"
          code="$(curl --max-time 25 -sS -X POST -o /tmp/paycoin-metrics.json -w '%{http_code}' -H "Authorization: Bearer $SECRET" "$endpoint")"
          if [ "$code" != "200" ]; then
            jq '{ok,code,detail}' /tmp/paycoin-metrics.json || true
            exit 1
          fi
          jq '{ok,current,autopost,queueTotal,queueStart,published}' /tmp/paycoin-metrics.json
