name: Check Cloudflare Wrangler Access
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-cf-wrangler.yml"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Wrangler whoami
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: npx --yes wrangler@4.41.0 whoami
