name: Deploy isolated PRAVO4U MAX Worker

on:
  push:
    branches: [main]
    paths:
      - 'pravo4u-max/**'
      - 'pravo4u-checkout/**'
      - '.github/workflows/deploy-pravo4u-max.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-max:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check source
        run: |
          node --check pravo4u-max/worker.js
          node --check pravo4u-max/robokassa.js
          node --check pravo4u-max/paywall-script.js
          node --check pravo4u-max/lex-dialogue.js
          node pravo4u-checkout/lex-dialogue.test.mjs
          node --check pravo4u-checkout/doc-generator.js
          node --check pravo4u-checkout/more-docs.js
          node --check pravo4u-checkout/rf-abroad-docs.js
          node --check pravo4u-max/partner-offers.js
          node --check pravo4u-max/catalog-2026.js
          node pravo4u-checkout/catalog.test.mjs
      - name: Test DOCX generation using synthetic identities
        shell: bash
        run: |
          set -euo pipefail
          node pravo4u-checkout/generator.test.mjs
          node pravo4u-checkout/payment.test.mjs
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from io import BytesIO
          from xml.etree import ElementTree
          docs=list(Path('/tmp').glob('pravo_*_test.docx'))+list(Path('/tmp').glob('pravo_*_test.zip'))
          assert len(docs)==23,(len(docs),[x.name for x in docs])
          for path in docs:
              with ZipFile(path) as z:
                  assert z.testzip() is None, path
                  names=z.namelist()
                  if path.suffix=='.docx':
                      assert 'word/document.xml' in names,path
                      ElementTree.fromstring(z.read('word/document.xml'))
                  else:
                      inner=[k for k in names if k.endswith('.docx')]
                      assert inner, path
                      for name in inner:
                          with ZipFile(BytesIO(z.read(name))) as f:
                              assert f.testzip() is None, (path,name)
                              ElementTree.fromstring(f.read('word/document.xml'))
          print('All 23 DOCX products valid, all inner ZIP files valid.')
          PY

          unzip -t /tmp/pravo_order_test.docx > /tmp/order_unzip.log
          unzip -t /tmp/pravo_rent_test.zip > /tmp/rent_unzip.log
          grep -q "No errors detected" /tmp/order_unzip.log
          grep -q "No errors detected" /tmp/rent_unzip.log
          for file in loan service; do
            unzip -t "/tmp/pravo_${file}_test.zip" > /tmp/newzip.log
            grep -q "No errors detected" /tmp/newzip.log
            unzip -Z1 "/tmp/pravo_${file}_test.zip" | grep -q '01_'
          done
          for file in fssp_minimum course_refund; do
            unzip -t "/tmp/pravo_${file}_test.docx" > /tmp/newdoc.log
            grep -q "No errors detected" /tmp/newdoc.log
          done
          unzip -Z1 /tmp/pravo_rent_test.zip > /tmp/rent_manifest
          test "$(wc -l < /tmp/rent_manifest)" -eq 5
      - name: Find target Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          accounts=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" 'https://api.cloudflare.com/client/v4/accounts?per_page=100')
          found=""
          for account in $(printf '%s' "$accounts" | jq -r '.result[].id'); do
            response=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$account/workers/subdomain")
            sub=$(printf '%s' "$response" | jq -r '.result.subdomain // empty')
            if [ "$sub" = "cbd-legal-cloudflare-worker" ]; then
              found="$account"
              break
            fi
          done
          test -n "$found"
          echo "CLOUDFLARE_ACCOUNT_ID=$found" >> "$GITHUB_ENV"
      - name: Deploy MAX worker only
        run: npx --yes wrangler@4.147.0 deploy --config pravo4u-max/wrangler.jsonc
      - name: Verify live MAX service
        shell: bash
        run: |
          set -euo pipefail
          base='https://pravo4u-max.cbd-legal-cloudflare-worker.workers.dev'
          curl --retry 3 --retry-all-errors --retry-delay 2 --max-time 20 -fsS "$base/health" > /tmp/health.json
          jq -e '.ok == true and .version == "max-lex-rf-1.1.0" and .token_configured == true' /tmp/health.json >/dev/null
          for name in order rent; do
            curl -fsS --max-time 25 "$base/documents/$name.docx" -o "/tmp/$name.docx"
            unzip -t "/tmp/$name.docx" > /tmp/docout.txt
            grep -q "No errors detected" /tmp/docout.txt
          done
          for page in store store/terms store/privacy store/refunds store/partners compose; do
            curl -fsS --max-time 25 "$base/$page" -o /tmp/page.html
            grep -q "ПРАВО4U" /tmp/page.html
          done
          curl -fsS "$base/compose/app.js" -o /tmp/local.js
          node --check /tmp/local.js
          for kind in order rent loan service fssp_minimum course_refund rf_remote_contract_copy rf_pd_request; do
            curl -fsS --max-time 25 "$base/compose?type=$kind" -o /tmp/form.html
            grep -iq 'конструктор DOCX' /tmp/form.html
          done
          curl -fsS "$base/store/partners" -o /tmp/partner.html
          grep -q '10773' /tmp/partner.html
          if grep -Eq 'href="https://go.sravni.ru/' /tmp/partner.html; then echo "Unapproved affiliate link appeared" >&2; exit 1; fi
          echo "No unverified tracked affiliate links released."
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$base/compose?type=kz_rental")" = "404"
          curl -fsS "$base/api/pay/config" -o /tmp/robo.json
          jq -e '.ready == false and .priceRub == 50' /tmp/robo.json >/dev/null
          curl -sS -o /tmp/not_ready.json -w '%{http_code}' -X POST -H 'Origin: https://pravo4u-max.cbd-legal-cloudflare-worker.workers.dev' -H 'Content-Type: application/json' -d '{"invoice":1,"claim":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","product":"order"}' "$base/api/pay/source" > /tmp/disabled_status
          test "$(cat /tmp/disabled_status)" = "503"
          echo "Paid private JS endpoint fails closed until approval."
          curl -fsS --max-time 25 "$base/store" -o /tmp/lex_store.html
          grep -q "Лекс" /tmp/lex_store.html
          curl -fsS --max-time 25 "$base/compose?type=kz_rental" -o /tmp/blocked_kz.html -w '%{http_code}' > /tmp/kz_status || test -s /tmp/kz_status
          test "$(cat /tmp/kz_status)" = "404"
          echo "LEX READY; KAZAKHSTAN BLOCKED; ROBOKASSA OFF; TELEGRAM UNCHANGED"
