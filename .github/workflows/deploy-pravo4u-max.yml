name: Deploy isolated PRAVO4U MAX Worker

on:
  push:
    branches: [main]
    paths:
      - 'pravo4u-max/**'
      - 'pravo4u-checkout/**'
      - '.github/workflows/deploy-pravo4u-max.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-max:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check source
        run: |
          node --check pravo4u-max/worker.js
          node --check pravo4u-max/robokassa.js
          node --check pravo4u-max/paywall-script.js
          node --check pravo4u-max/lex-dialogue.js
          node --check pravo4u-max/subscription-gate.js
          node pravo4u-checkout/max-subscription-gate.test.mjs
          node pravo4u-checkout/doc-access.test.mjs
          node --check pravo4u-max/channel-registry.js
          node --check pravo4u-max/channel-pin.js
          node pravo4u-checkout/max-pin-media.test.mjs
          node --check pravo4u-max/telegram-mirror.js
          node --check pravo4u-max-trust/server.mjs
          node pravo4u-checkout/telegram-mirror.test.mjs
          node pravo4u-checkout/max-telegram-mirror.test.mjs
          node --check pravo4u-max-trust/server.mjs
          node pravo4u-checkout/max-channel-discovery.test.mjs
          node --check pravo4u-max/seo-guides.js
          node pravo4u-checkout/seo-guides.test.mjs
          node pravo4u-checkout/lex-dialogue.test.mjs
          node pravo4u-checkout/aviation-lex-ux.test.mjs
          node pravo4u-checkout/services-intake.test.mjs
          node pravo4u-checkout/mailbox-routing.test.mjs
          node --check pravo4u-max/security-commerce.js
          node --check pravo4u-max/security-network.js
          node --check pravo4u-max/security-leads.js
          node --check pravo4u-max/security-direct-intake.js
          node --check pravo4u-max/security-pages.js
          node pravo4u-checkout/security-network.test.mjs
          node pravo4u-checkout/security-intake.test.mjs
          node --check pravo4u-max/section-sharing.js
          node pravo4u-checkout/section-sharing.test.mjs
          python3 -m unittest discover -s security-intake-ru -p 'test_*.py'
          node --check pravo4u-max/form-guidance.js
          node pravo4u-checkout/form-guidance.test.mjs
          node pravo4u-checkout/growth-links.test.mjs
          node --check pravo4u-max/growth-counters.js
          node pravo4u-checkout/growth-counters.test.mjs
          node --check pravo4u-checkout/doc-generator.js
          node --check pravo4u-checkout/more-docs.js
          node --check pravo4u-checkout/realty-docs.js
          node --check pravo4u-checkout/realty-addons.js
          node --check pravo4u-checkout/rf-abroad-docs.js
          node --check pravo4u-max/partner-offers.js
          node --check pravo4u-max/partner-pipeline.js
          node --check pravo4u-max/retention-pages.js
          node pravo4u-checkout/sravni-links.test.mjs
          node --check pravo4u-max/catalog-2026.js
          node pravo4u-checkout/catalog.test.mjs
          node pravo4u-checkout/legal-document-inventory.test.mjs
          node pravo4u-checkout/free-program.test.mjs
          node pravo4u-checkout/support-cloudtips.test.mjs
      - name: Test DOCX generation using synthetic identities
        shell: bash
        run: |
          set -euo pipefail
          node pravo4u-checkout/generator.test.mjs
          node pravo4u-checkout/payment.test.mjs
          node pravo4u-checkout/payment-ui.test.mjs
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from io import BytesIO
          from xml.etree import ElementTree
          docs=list(Path('/tmp').glob('pravo_*_test.docx'))+list(Path('/tmp').glob('pravo_*_test.zip'))
          assert len(docs)==34,(len(docs),[x.name for x in docs])
          for path in docs:
              with ZipFile(path) as z:
                  assert z.testzip() is None, path
                  names=z.namelist()
                  if path.suffix=='.docx':
                      assert 'word/document.xml' in names,path
                      ElementTree.fromstring(z.read('word/document.xml'))
                  else:
                      inner=[k for k in names if k.endswith('.docx')]
                      assert inner, path
                      for name in inner:
                          with ZipFile(BytesIO(z.read(name))) as f:
                              assert f.testzip() is None, (path,name)
                              ElementTree.fromstring(f.read('word/document.xml'))
          print('All 34 DOCX products valid, all inner ZIP files valid.')
          PY

          unzip -t /tmp/pravo_order_test.docx > /tmp/order_unzip.log
          unzip -t /tmp/pravo_rent_test.zip > /tmp/rent_unzip.log
          grep -q "No errors detected" /tmp/order_unzip.log
          grep -q "No errors detected" /tmp/rent_unzip.log
          for file in loan service; do
            unzip -t "/tmp/pravo_${file}_test.zip" > /tmp/newzip.log
            grep -q "No errors detected" /tmp/newzip.log
            unzip -Z1 "/tmp/pravo_${file}_test.zip" | grep -q '01_'
          done
          for file in fssp_minimum course_refund; do
            unzip -t "/tmp/pravo_${file}_test.docx" > /tmp/newdoc.log
            grep -q "No errors detected" /tmp/newdoc.log
          done
          unzip -Z1 /tmp/pravo_rent_test.zip > /tmp/rent_manifest
          test "$(wc -l < /tmp/rent_manifest)" -eq 5
      - name: Find target Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          accounts=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" 'https://api.cloudflare.com/client/v4/accounts?per_page=100')
          found=""
          for account in $(printf '%s' "$accounts" | jq -r '.result[].id'); do
            response=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$account/workers/subdomain")
            sub=$(printf '%s' "$response" | jq -r '.result.subdomain // empty')
            if [ "$sub" = "cbd-legal-cloudflare-worker" ]; then
              found="$account"
              break
            fi
          done
          test -n "$found"
          echo "CLOUDFLARE_ACCOUNT_ID=$found" >> "$GITHUB_ENV"
      - name: Deploy MAX worker only
        run: npx --yes wrangler@4.147.0 deploy --config pravo4u-max/wrangler.jsonc
      - name: Verify live MAX service
        shell: bash
        run: |
          set -euo pipefail
          base='https://pravo4u-max.cbd-legal-cloudflare-worker.workers.dev'
          curl --retry 3 --retry-all-errors --retry-delay 2 --max-time 20 -fsS "$base/health" > /tmp/health.json
          curl -fsS --max-time 20 "$base/max/webhook-health" -o /tmp/maxwebhook.json
          jq -e '.active|type=="boolean"' /tmp/maxwebhook.json >/dev/null
          curl -fsS --max-time 20 "$base/max/mirror-status" -o /tmp/mirror.json
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsS --max-time 30 "$base/max/pin-status" -o /tmp/pin.json
          jq -e 'has("pinned") and has("status") and has("canPin")' /tmp/pin.json >/dev/null
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$base/setup")" = "404"
          jq -e 'has("channelReady") and has("mirror")' /tmp/mirror.json >/dev/null
          curl -fsS --max-time 20 "$base/max/channel-status" -o /tmp/maxchannel.json
          jq -e '(.ready == true and (.channel.url | startswith("https://max.ru/"))) or (.ready == false and .channel == null)' /tmp/maxchannel.json >/dev/null
          curl -fsS --max-time 20 "$base/store/reminder" -o /tmp/reminder_page.html
          grep -q "календаря" /tmp/reminder_page.html
          curl -fsS --max-time 20 "$base/store/reminder.js" -o /tmp/reminder_client.js
          node --check /tmp/reminder_client.js
          jq -e '.ok == true and .version == "max-lex-growth-1.2.0" and .token_configured == true' /tmp/health.json >/dev/null
          for name in order rent; do
            curl -fsS --max-time 25 "$base/documents/$name.docx" -o "/tmp/$name.docx"
            unzip -t "/tmp/$name.docx" > /tmp/docout.txt
            grep -q "No errors detected" /tmp/docout.txt
          done
          for page in store store/terms store/privacy store/refunds store/partners store/club services/individual services/transcription compose; do
            curl -fsS --max-time 25 -H "Cache-Control: no-cache" "$base/$page?smoke=${GITHUB_RUN_ID}" -o /tmp/page.html
            grep -q "ПРАВО4U" /tmp/page.html
            if grep -Eq 'Никитин Андрей Игоревич|583403642667' /tmp/page.html; then echo "Personal owner identifiers exposed on public page $page" >&2; exit 1; fi
          done
          curl -fsS --max-time 25 -H "Cache-Control: no-cache" "$base/security?source=MAX&smoke=${GITHUB_RUN_ID}" -o /tmp/security_hub
          curl -fsS --max-time 25 -H "Cache-Control: no-cache" "$base/security/home?source=MAX&smoke=${GITHUB_RUN_ID}" -o /tmp/security_home
          curl -fsS --max-time 25 "$base/security/app.js" -o /tmp/security_app
          node --check /tmp/security_app
          grep -q 'Семья, дом и бизнес' /tmp/security_hub
          grep -q 'ПРАЙД 500' /tmp/security_home
          grep -q '500 ₽' /tmp/security_home
          grep -q 'ПРАЙД Бизнес' /tmp/security_home
          grep -q '990 ₽' /tmp/security_home
          grep -q 'Самара' /tmp/security_home
          grep -q 'Казань' /tmp/security_home
          curl -fsS --max-time 25 -H "Cache-Control: no-cache" "$base/security/network?source=MAX&smoke=${GITHUB_RUN_ID}" -o /tmp/security_network
          grep -q 'Саратов' /tmp/security_network
          grep -q 'Сочи' /tmp/security_network
          grep -q 'Стать партнёром' /tmp/security_hub
          grep -q '/security/consent' /tmp/security_home
          grep -q 'Заявки пока не принимаются' /tmp/security_home
          grep -q 'disabled' /tmp/security_home
          grep -q '/security/api/intake-token' /tmp/security_app
          if grep -q 'fetch("/security/api/leads"' /tmp/security_app; then echo "PII proxy call remains in live Security client" >&2; exit 1; fi
          proxy_status=$(curl -sS --max-time 20 -o /tmp/security_proxy_disabled.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "$base/security/api/leads")
          test "$proxy_status" = "410"
          jq -e '.error == "direct_ru_intake_required"' /tmp/security_proxy_disabled.json >/dev/null
          token_status=$(curl -sS --max-time 20 -o /tmp/security_token_disabled.json -w '%{http_code}' -X POST "$base/security/api/intake-token")
          test "$token_status" = "503"
          jq -e '.error == "intake_not_configured"' /tmp/security_token_disabled.json >/dev/null
          echo "SECURITY_DIRECT_RU_CLIENT_LIVE=true, Cloudflare_PII_proxy_disabled=true, RU_intake_flag=false"
          curl -fsS --max-time 25 -H "Cache-Control: no-cache" "$base/services/individual?smoke=${GITHUB_RUN_ID}" -o /tmp/lex_individual
          curl -fsS --max-time 25 -H "Cache-Control: no-cache" "$base/services/transcription?smoke=${GITHUB_RUN_ID}" -o /tmp/lex_audio
          grep -q 'mailto:lexpravo4u@gmail.com' /tmp/lex_individual
          grep -q 'mailto:gptai017@gmail.com' /tmp/lex_audio
          grep -q 'Узнать стоимость' /tmp/lex_audio
          grep -q 'Как заказать — три шага' /tmp/lex_audio
          if grep -Eq 'не менее 1 000|Никитин Андрей Игоревич|583403642667' /tmp/lex_individual /tmp/lex_audio; then echo 'Public conversion page leaked personal identity or hard pricing' >&2; exit 1; fi
          grep -q '34 типовых' /tmp/lex_individual
          if grep -Eq '<form|<input|go.sravni.ru|/api/pay/' /tmp/lex_individual /tmp/lex_audio; then echo 'Unsafe inquiry collection or checkout detected' >&2; exit 1; fi
          echo "Independent service inquiry pages live; no checkout, no uploads, no personal-data form"
          curl -fsS --max-time 25 "$base/robots.txt" -o /tmp/lex_robots
          grep -q 'Disallow: /compose' /tmp/lex_robots
          curl -fsS --max-time 25 "$base/sitemap.xml" -o /tmp/lex_sitemap
          grep -q '/guides/court-order' /tmp/lex_sitemap
          grep -q '/services/individual' /tmp/lex_sitemap
          grep -q '/services/transcription' /tmp/lex_sitemap
          for slug in court-order fssp online-course rent npd-contract order-from-fssp bailiff-complaint delivery-delay; do
            curl -fsS --max-time 25 "$base/guides/$slug" -o /tmp/lex_guide
            grep -q 'rel="canonical"' /tmp/lex_guide
            grep -q 'Подготовить DOCX бесплатно' /tmp/lex_guide
            grep -q 'Написать запрос по этой теме' /tmp/lex_guide
          done
          echo 'Search and inquiry funnel: 8 guide pages, lead CTA, sitemap, robots OK'
          curl -fsS --max-time 25 "$base/compose/hints.js" -o /tmp/lex_hints.js
          node --check /tmp/lex_hints.js
          grep -q 'Расшифровка аудио' /tmp/lex_hints.js
          grep -q 'Уборка помещения' /tmp/lex_hints.js
          curl -fsS --max-time 25 -H "Cache-Control: no-cache" "$base/store?smoke=${GITHUB_RUN_ID}" -o /tmp/lex_human_store
          grep -q 'Чаще всего ищут' /tmp/lex_human_store
          grep -q 'Поделиться бесплатным Лексом с другом' /tmp/lex_human_store
          grep -q 'Все 34 документа по темам' /tmp/lex_human_store
          echo "Local-only form guidance and human-first catalogue published"
          curl -fsS "$base/compose/app.js" -o /tmp/local.js
          node --check /tmp/local.js
          for kind in order rent loan service fssp_minimum course_refund rf_remote_contract_copy rf_pd_request; do
            curl -fsS --max-time 25 "$base/compose?type=$kind" -o /tmp/form.html
            grep -iq 'конструктор DOCX' /tmp/form.html
          done
          curl -fsS "$base/store/partners" -o /tmp/partner.html
          grep -q '10773' /tmp/partner.html
          grep -q '101540' /tmp/partner.html
          grep -q 'Партнёрский URL подтверждён' /tmp/partner.html
          grep -q 'страхование ипотеки' /tmp/partner.html || grep -q 'Страхование ипотеки' /tmp/partner.html
          if grep -Eq 'href="https://go.sravni.ru/' /tmp/partner.html; then echo "Unapproved affiliate link appeared" >&2; exit 1; fi
          echo "No unverified tracked affiliate links released."
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$base/compose?type=kz_rental")" = "404"
          curl -fsS "$base/api/pay/config" -o /tmp/robo.json
          jq -e '.priceRub == 0 and .ready == false and .mode == "free"' /tmp/robo.json >/dev/null
          curl -sS --max-time 25 -o /tmp/no_payment.json -w '%{http_code}' -X POST -H 'Origin: https://pravo4u-max.cbd-legal-cloudflare-worker.workers.dev' -H 'Content-Type: application/json' -d '{"product":"order"}' "$base/api/pay/create" > /tmp/disabled_status
          test "$(cat /tmp/disabled_status)" = "410"
          jq -e '.error == "FREE_DOCUMENTS_PAYMENT_DISABLED"' /tmp/no_payment.json >/dev/null
          curl -fsS --max-time 25 "$base/compose?type=order" -o /tmp/free_document.html
          grep -q 'Бесплатно для всех' /tmp/free_document.html
          if grep -Eq 'payzone|967.445.92.20' /tmp/free_document.html; then echo 'Old checkout or contact leaked' >&2; exit 1; fi
          curl -fsS --max-time 25 "$base/store/terms" -o /tmp/terms.html
          grep -q 'Условия бесплатного использования' /tmp/terms.html
          curl -fsS --max-time 25 "$base/store/support" -o /tmp/support.html
          grep -q 'Поддержать бесплатный проект' /tmp/support.html
          echo "All published DOCX permanently free; checkout disabled; email-only; support page reachable"
          curl -fsS --max-time 25 "$base/store" -o /tmp/lex_store.html
          grep -q "Лекс" /tmp/lex_store.html
          grep -q "Отправить запрос на документ" /tmp/lex_store.html
          grep -q "/guides/order-from-fssp" /tmp/lex_store.html
          curl -fsS --max-time 25 "$base/compose?type=kz_rental" -o /tmp/blocked_kz.html -w '%{http_code}' > /tmp/kz_status || test -s /tmp/kz_status
          test "$(cat /tmp/kz_status)" = "404"
          echo "LEX READY; KAZAKHSTAN BLOCKED; ROBOKASSA OFF; TELEGRAM UNCHANGED"
