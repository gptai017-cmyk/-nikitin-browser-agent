name: Inspect Telegram legacy gift flow and share anchors
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-telegram-share-anchors.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT: ead717e4aeccf34fc50aa3832f12221f
    steps:
      - name: Inspect short sanitized gift and start handler source fragments
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN"
          curl -fsS --max-time 40 -H "Authorization: Bearer $CF_API_TOKEN" \
           "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/cbd-legal-advokat4u" -o /tmp/tg-anchors
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const blob=fs.readFileSync('/tmp/tg-anchors','utf8'),boundary=blob.split(/\r?\n/,1)[0];
          const marker='Content-Disposition: form-data; name="index.js"\r\n\r\n';
          const i=blob.indexOf(marker)+marker.length,j=blob.indexOf('\r\n'+boundary,i);
          if(i<marker.length||j<0)throw Error("unexpected_multipart");
          const s=blob.slice(i,j),low=s.toLowerCase();
          const starts=['async function invite(','async function screen(','async function offer(','async function choose(','async function showHome(','async function handleMessage(','async function handleCallback(','async function handleUpdate(','function mainMenu() {','gift:invite','gift:share','gift:faq','gift:choose','gift:offer','25\\u2B50','25\\u'];
          function sanitize(fragment){
           return fragment
            .replace(/https?:\/\/[^\s"'<>]+/gi,'[url]')
            .replace(/\b[A-Za-z0-9_-]{35,}\b/g,'[data]')
            .replace(/\b\d{8,}\b/g,'[number]')
            .replace(/\\u\{([0-9a-fA-F]+)\}/g,(_,h)=>String.fromCodePoint(parseInt(h,16)))
            .replace(/\\u([0-9a-fA-F]{4})/g,(_,h)=>String.fromCharCode(parseInt(h,16)));
          }
          for(const x of starts){
           const idx=s.indexOf(x);
           console.log('LOC '+JSON.stringify({key:x,idx}));
           if(idx>=0)console.log('FRAGMENT '+JSON.stringify({key:x,excerpt:sanitize(s.slice(Math.max(0,idx-120),idx+Math.min(1750,idx>1300000?2300:1750)))}));
          }
          NODE
