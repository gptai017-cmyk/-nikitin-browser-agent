name: FPG GeoDNS Test
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fpg-geodns-test.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    steps:
      - name: Resolve through multiple DNS resolvers and test IPs
        shell: bash
        run: |
          set +e
          HOST='xn--80afcdbalict6afooklqi5o.xn--p1ai'
          URL="https://$HOST/public/"
          sudo apt-get update -qq
          sudo apt-get install -y -qq dnsutils
          : > /tmp/ips
          for dns in 77.88.8.8 77.88.8.1 8.8.8.8 1.1.1.1 9.9.9.9; do
            echo "=== DNS $dns ==="
            dig +time=4 +tries=1 @$dns A "$HOST" +short | tee /tmp/ans
            grep -E '^[0-9]+(\.[0-9]+){3}$' /tmp/ans >> /tmp/ips
          done
          echo "=== SYSTEM ==="
          getent ahostsv4 "$HOST" | awk '{print $1}' | sort -u | tee -a /tmp/ips
          echo "=== UNIQUE IPS ==="
          sort -u /tmp/ips | tee /tmp/uniq
          while read ip; do
            [ -z "$ip" ] && continue
            echo "=== TEST $ip ==="
            curl -k -I --resolve "$HOST:443:$ip" --connect-timeout 8 --max-time 15 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36' "$URL" 2>&1 | head -n 20
          done < /tmp/uniq
