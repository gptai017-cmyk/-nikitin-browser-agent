name: Check Cloudflare Deploy Secrets
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-cf-secrets.yml"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - name: Check secret presence
        env:
          A: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          B: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          C: ${{ secrets.CF_API_TOKEN }}
          D: ${{ secrets.CF_ACCOUNT_ID }}
          E: ${{ secrets.CLOUDFLARE_API_KEY }}
          F: ${{ secrets.CLOUDFLARE_EMAIL }}
        run: |
          for v in A B C D E F; do
            if [ -n "${!v}" ]; then echo "$v=present"; else echo "$v=absent"; fi
          done
