name: PAYCOIN Directory Index Audit
on:
  push:
    branches: [main]
    paths: [".github/workflows/paycoin-directory-index-check.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read public directory results without submitting again
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,re,html
          sites=[
          ('TeleSeeker','https://teleseeker.com/c/paycoin'),
          ('TGMetrix','https://tgmetrix.com/en/channel/paycoin'),
          ('TGMetrix-alternate','https://tgmetrix.com/en/channels/paycoin'),
          ]
          for name,url in sites:
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=20) as resp:
                page=resp.read(250000).decode('utf-8','replace')
                title=re.search(r'<title[^>]*>(.*?)</title>',page,re.I|re.S)
                print(name,'HTTP',resp.status,'url',resp.url,'title',html.unescape(title.group(1)).strip()[:160] if title else None,'telegram-link',('t.me/paycoin' in page))
            except urllib.error.HTTPError as e:
              print(name,'HTTP',e.code,'url',url)
            except Exception as e:
              print(name,'ERROR',type(e).__name__,str(e)[:160])
          PY
