name: Yandzeen Funnel QA
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/yandzeen-funnel-qa.yml"
      - "zen/content/calendar.json"
      - "zen/scripts/publish.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check every unpublished article has a meaningful conversion route
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const cal=JSON.parse(fs.readFileSync('zen/content/calendar.json','utf8'));
          const published=JSON.parse(fs.readFileSync('zen/state/published.json','utf8'));
          const done=new Set(published.map(x=>x.slug));
          const counts={};
          for(const article of cal.articles){
            if(done.has(article.slug))continue;
            const f=article.funnel;
            if(!f||!f.objective||!f.destination||!f.cta_text||!f.conversion_event)throw Error('MISSING_FUNNEL: '+article.slug);
            const text=article.telegram_excerpt+'\n\n'+f.cta_text;
            if([...text].length>1490||[...text].length<600)throw Error('INVALID_LENGTH: '+article.slug+' '+[...text].length);
            if(f.objective==='land-interest'){
              if(!article.editorial_tags?.length)throw Error('LAND_WITHOUT_EDITORIAL_TAGS: '+article.slug);
              if(f.paid_direct_messages!==true||!f.cta_text.includes('платные сообщения')||!f.cta_text.includes('https://t.me/zemlibank'))throw Error('LAND_PAID_POLICY_UNCLEAR: '+article.slug);
              if(!f.cta_text.includes('без телефона'))throw Error('PUBLIC_COMMENT_PRIVACY_MISSING: '+article.slug);
            }
            if(f.objective==='pravo4u-lead'&&!f.cta_text.includes('https://t.me/advokat4ubot'))throw Error('MISSING_BOT_LINK: '+article.slug);
            counts[f.objective]=(counts[f.objective]||0)+1;
          }
          console.log('STATUS=PASS');
          console.log('REMAINING_ARTICLES='+Object.values(counts).reduce((a,b)=>a+b,0));
          console.log('FUNNEL_DISTRIBUTION='+JSON.stringify(counts));
          console.log('NOTE=Links still require actual Dzen mirror click-through verification');
          NODE
