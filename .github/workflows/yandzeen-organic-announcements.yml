name: Yandzeen - Organic Owned Channel Announcements
# Recheck newly granted permissions for one-time posts
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/yandzeen-organic-announcements.yml"
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yandzeen-organic-announcements
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Make one relevant announcement in each owned channel if authorized
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node zen/scripts/organic-announcements.mjs
      - name: Persist announcements
        if: always()
        shell: bash
        run: |
          if ! git diff --quiet -- zen/metrics/crosspromo.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add zen/metrics/crosspromo.json
            git commit -m "Record owned-channel organic Dzen invitation"
            git pull --rebase
            git push
          fi
