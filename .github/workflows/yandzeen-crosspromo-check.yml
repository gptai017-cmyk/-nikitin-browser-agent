name: Yandzeen Cross-Promo Access Check
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/yandzeen-crosspromo-check.yml"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check available owned-channel publisher permissions
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          node <<'NODE'
          const token=process.env.TOKEN;
          if(!token)throw new Error("No token");
          const req=async(method,body)=>{
            const r=await fetch("https://api.telegram.org/bot"+token+"/"+method,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});
            return await r.json();
          };
          const me=await req("getMe",{});if(!me.ok)throw Error("Cannot identify bot");
          for(const name of ["@zemlibank","@pravo4urus"]) {
            const ch=await req("getChat",{chat_id:name});
            if(!ch.ok){console.log(name+" CHAT=UNAVAILABLE");continue;}
            const admins=await req("getChatAdministrators",{chat_id:name});
            if(admins.ok){
              const self=admins.result.find(a=>a.user?.id===me.result.id);
              console.log(name+" FOUND_IN_ADMINS="+Boolean(self)+" ADMINS_COUNT="+admins.result.length);
              if(self)console.log(name+" ADMIN_RIGHTS_CAN_POST="+(self.can_post_messages===true));
            } else {console.log(name+" ADMIN_LIST_ERROR="+String(admins.description||"unknown").slice(0,100));}
            const m=await req("getChatMember",{chat_id:name,user_id:me.result.id});
            if(!m.ok){console.log(name+" ADMIN=UNAVAILABLE REASON="+String(m.description||"unknown").slice(0,120));continue;}
            console.log(name+" STATUS="+m.result.status+" CAN_POST="+(m.result.can_post_messages===true)+" CAN_CHANGE_INFO="+(m.result.can_change_info===true));
          }
          NODE
