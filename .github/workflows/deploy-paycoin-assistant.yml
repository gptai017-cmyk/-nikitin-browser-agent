name: Deploy PAYCOIN isolated Worker

on:
  push:
    branches: [main]
    paths:
      - 'paycoin-assistant/**'
      - '.github/workflows/deploy-paycoin-assistant.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paycoin-assistant-deploy
  cancel-in-progress: false

jobs:
  deploy-paycoin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install and test
        working-directory: paycoin-assistant
        run: |
          npm install --no-audit --no-fund
          npm test
          node --check worker.js
      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CF_API_TOKEN in GitHub Actions secrets"; exit 1; }
      - name: Deploy only PayCoin Worker
        working-directory: paycoin-assistant
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ead717e4aeccf34fc50aa3832f12221f
        run: |
          npx wrangler deploy --config wrangler.jsonc
