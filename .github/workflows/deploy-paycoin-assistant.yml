name: Deploy PAYCOIN isolated Worker

on:
  push:
    branches: [main]
    paths:
      - 'paycoin-assistant/**'
      - '.github/workflows/deploy-paycoin-assistant.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paycoin-assistant-deploy
  cancel-in-progress: false

jobs:
  deploy-paycoin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install and test
        working-directory: paycoin-assistant
        run: |
          npm install --no-audit --no-fund
          npm test
          node --check worker.js
      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CF_API_TOKEN in GitHub Actions secrets"; exit 1; }
      - name: Deploy only PayCoin Worker
        working-directory: paycoin-assistant
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ead717e4aeccf34fc50aa3832f12221f
        run: |
          npx wrangler deploy --config wrangler.jsonc
      - name: Ensure dedicated webhook verification secret
        working-directory: paycoin-assistant
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ead717e4aeccf34fc50aa3832f12221f
        shell: bash
        run: |
          set -euo pipefail
          secret_list="$(npx wrangler secret list --name paycoin-assistant --format json)"
          if ! printf '%s' "$secret_list" | jq -e '.[] | select(.name=="WEBHOOK_SECRET")' >/dev/null; then
            webhook_secret="$(openssl rand -hex 32)"
            printf '%s' "$webhook_secret" | npx wrangler secret put WEBHOOK_SECRET --name paycoin-assistant >/dev/null
            echo "Installed protected WEBHOOK_SECRET (not displayed)."
          else
            echo "WEBHOOK_SECRET already exists; preserving current key."
          fi
      - name: Check configured Telegram secret and public Worker status
        working-directory: paycoin-assistant
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ead717e4aeccf34fc50aa3832f12221f
        run: |
          set -euo pipefail
          names="$(npx wrangler secret list --name paycoin-assistant --format json)"
          printf '%s' "$names" | jq -e '.[] | select(.name=="TELEGRAM_BOT_TOKEN")' >/dev/null
          printf '%s' "$names" | jq -e '.[] | select(.name=="WEBHOOK_SECRET")' >/dev/null
          url='https://paycoin-assistant.cbd-legal-cloudflare-worker.workers.dev/health'
          for n in 1 2 3 4 5; do
            if curl --max-time 15 -fsS "$url" -o /tmp/paycoin-health.json; then
              if jq -e '.ok == true and .bot == "@PayCoinPublisherBot"' /tmp/paycoin-health.json >/dev/null; then
                jq '{ok,service,bot,autopost,poll,groupGuide,audience}' /tmp/paycoin-health.json
                exit 0
              fi
            fi
            sleep 5
          done
          echo '::error::Public PayCoin Worker health check failed'
          exit 1
