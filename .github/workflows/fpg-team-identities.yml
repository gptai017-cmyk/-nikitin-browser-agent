name: FPG team member identity audit
on:
  push:
    branches: [main]
    paths: [".github/workflows/fpg-team-identities.yml"]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install chromium
      - name: Inspect team member identity without changes
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FPG_LOGIN: ${{ secrets.FPG_LOGIN }}
          FPG_PASSWORD: ${{ secrets.FPG_PASSWORD }}
          BROWSER_BRIDGE_URL: "https://nikitin-browser-bridge.cbd-legal-cloudflare-worker.workers.dev"
          BROWSER_TASK_PLAINTEXT: '[[BROWSER_SCOPE:GRANT]] DIRECT_JSON:{"url":"https://xn--80afcdbalict6afooklqi5o.xn--p1ai/application/about-project?applicationId=8546be37-971f-4a0f-ba12-af9876ee6d0f","actions":[{"op":"click_text","value":"Команда","exact":false,"wait_ms":2500},{"op":"inspect_team_card","member":5},{"op":"inspect_team_card","member":7},{"op":"inspect_team_card","member":9},{"op":"inspect_last_team_member"}]}'
        shell: bash
        run: |
          set +e
          node src/execute-dispatch.js > /tmp/fpg-team-identities.log 2>&1
          RC=$?
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const s=fs.readFileSync("/tmp/fpg-team-identities.log","utf8");
          const i=s.indexOf("DIRECT_JSON_OUTPUT_V1");
          const x=i>=0?s.slice(i):s.slice(-1800);
          const surname=[...x.matchAll(/"placeholder": "Фамилия",[\s\S]{0,210}?"value": "([^"]*)"/g)].map(m=>m[1]);
          const names=[...x.matchAll(/"placeholder": "Имя",[\s\S]{0,210}?"value": "([^"]*)"/g)].map(m=>m[1]);
          const last=x.match(/inspect_last_team_member:[^\n]{0,400}/)?.[0]||"";
          console.log("FPG_MEMBER_NAMES "+JSON.stringify({surname:[...new Set(surname)],names:[...new Set(names)],last:last.slice(0,400),rc:RC}));
          console.log("FPG_MEMBER_RESULT "+x.slice(0,12000).replace(/https?:\/\/[^\s]+/g,"[url]"));
          NODE
          echo "EXIT=$RC"
          test "$RC" -eq 0
