name: FPG approved goal correction
on:
  push:
    branches: [main]
    paths: [".github/workflows/fpg-goal-correction.yml"]
permissions:
  contents: read
jobs:
  goal:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install chromium
      - name: Correct goal in approved FPG application
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FPG_LOGIN: ${{ secrets.FPG_LOGIN }}
          FPG_PASSWORD: ${{ secrets.FPG_PASSWORD }}
          BROWSER_BRIDGE_URL: "https://nikitin-browser-bridge.cbd-legal-cloudflare-worker.workers.dev"
          BROWSER_TASK_PLAINTEXT: "[[BROWSER_SCOPE:GRANT]] DIRECT_JSON:{\"url\":\"https://xn--80afcdbalict6afooklqi5o.xn--p1ai/application/about-project?applicationId=8546be37-971f-4a0f-ba12-af9876ee6d0f\",\"actions\":[{\"op\":\"fill_section\",\"match\":\"Цель проекта\",\"value\":\"К 31 июля 2028 года вовлечь не менее 1 500 подростков и молодых людей 12–25 лет города Пензы в системную деятельность по сохранению исторической памяти о Герое Российской Федерации В. В. Канакине и сотрудниках специальных подразделений России через постоянно действующее мемориально-просветительское пространство, цифровой архив памяти, QR-навигацию, встречи с ветеранами и тематические экскурсии\",\"wait_ms\":2200},{\"op\":\"inspect_section\",\"match\":\"Цель проекта\"},{\"op\":\"inspect_errors\"}]}"
        shell: bash
        run: |
          set +e
          node src/execute-dispatch.js > /tmp/fpg-goal.log 2>&1
          RC=$?
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const s=fs.readFileSync("/tmp/fpg-goal.log","utf8");
          const x=s.indexOf("DIRECT_JSON_OUTPUT_V1");
          console.log("FPG_GOAL_RESULT "+(x>=0?s.slice(x,x+7000):s.slice(-1200)).replace(/https?:\/\/[^\s]+/g,"[url]"));
          console.log("RUN_EXIT="+process.env.RUN_EXIT);
          NODE
          echo "EXIT=$RC"
          test "$RC" -eq 0
