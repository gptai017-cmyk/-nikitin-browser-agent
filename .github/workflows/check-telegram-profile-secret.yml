name: Check Telegram public profile update capability
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-telegram-profile-secret.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      BOT1: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      BOT2: ${{ secrets.TG_BOT_TOKEN }}
      BOT3: ${{ secrets.PRAVO4U_TELEGRAM_BOT_TOKEN }}
    steps:
      - name: Report only availability, not secret values
        shell: bash
        run: |
          set -euo pipefail
          if test -n "$BOT1"; then echo 'TELEGRAM_BOT_TOKEN_AVAILABLE=true'; else echo 'TELEGRAM_BOT_TOKEN_AVAILABLE=false'; fi
          if test -n "$BOT2"; then echo 'TG_BOT_TOKEN_AVAILABLE=true'; else echo 'TG_BOT_TOKEN_AVAILABLE=false'; fi
          if test -n "$BOT3"; then echo 'PRAVO4U_TELEGRAM_BOT_TOKEN_AVAILABLE=true'; else echo 'PRAVO4U_TELEGRAM_BOT_TOKEN_AVAILABLE=false'; fi
