name: PAYCOIN Editorial Audit Snapshot
on:
  push:
    branches: [main]
    paths: [".github/workflows/paycoin-editorial-audit.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ead717e4aeccf34fc50aa3832f12221f
      CF_PAYCOIN_KV_ID: 516e0038bfbe4d268100e1823dca7617
    steps:
      - name: Fetch non-secret PayCoin publication records
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN" || { echo 'Cloudflare credential unavailable'; exit 1; }
          uri="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/storage/kv/namespaces/$CF_PAYCOIN_KV_ID"
          prefix='editorial%3A2026-11-04%3A'
          curl -fsS --retry 2 --max-time 20 -H "Authorization: Bearer $CF_API_TOKEN" "$uri/keys?prefix=$prefix&limit=100" -o /tmp/paycoin-keys.json
          jq -e '.success==true' /tmp/paycoin-keys.json >/dev/null
          echo "PAYCOIN_EDITORIAL_KEYS"
          jq -r '.result[] | .name' /tmp/paycoin-keys.json | sort
          echo "PAYCOIN_EDITORIAL_VALUES"
          while IFS= read -r key; do
            [ -n "$key" ] || continue
            value="$(curl -fsS --retry 2 --max-time 20 -H "Authorization: Bearer $CF_API_TOKEN" "$uri/values/$key")"
            printf '%s' "$value" | jq -c --arg key "$key" '{key:$key,state,messageId,at}'
          done < <(jq -r '.result[] | .name' /tmp/paycoin-keys.json | sort)
          echo "PAYCOIN_SNAPSHOT"
          for day in 2026-11-02 2026-11-03 2026-11-08 2026-11-09 2026-11-10 2026-11-11; do
            key="analytics:$day"
            if value="$(curl -fsS --max-time 15 -H "Authorization: Bearer $CF_API_TOKEN" "$uri/values/$key" 2>/dev/null)"; then
              printf '%s' "$value" | jq -c '{date,channelSubscribers,groupMembers}'
            fi
          done
