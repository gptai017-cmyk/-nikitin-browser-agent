name: Cloudflare Secret Probe
on:
  push:
    branches: [main]
    paths: [".github/workflows/cf-secret-probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Check configured Cloudflare deploy secrets
        env:
          A: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          B: ${{ secrets.CF_API_TOKEN }}
          C: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          node -e 'for (const k of ["A","B","C","D"]) console.log(k+"="+(process.env[k]?"present":"absent"))'
