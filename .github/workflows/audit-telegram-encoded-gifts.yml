name: Audit Telegram Lex encoded gift share strings read-only
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-telegram-encoded-gifts.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT: ead717e4aeccf34fc50aa3832f12221f
    steps:
      - name: Inspect only public-facing menu, share/referral labels and encoded rewards
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 40 -H "Authorization: Bearer $CF_API_TOKEN" \
             "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/cbd-legal-advokat4u" -o /tmp/lex-audit-encoded
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const b=fs.readFileSync('/tmp/lex-audit-encoded','utf8');
          const boundary=b.split(/\r?\n/,1)[0],marker='Content-Disposition: form-data; name="index.js"\r\n\r\n';
          const start=b.indexOf(marker)+marker.length,end=b.indexOf('\r\n'+boundary,start);
          if(start<marker.length||end<0)throw Error('Unexpected Cloudflare source');
          const s=b.slice(start,end);
          const patterns=['подар','Подар','⭐','🌟','Stars','звезд','звёзд','25 ','бесплат','приве','приглас','реферал','поделит'];
          let output=0;
          for(const m of s.matchAll(/"(?:[^"\\]|\\.){1,600}"/g)){
            let raw=m[0],decoded;
            try{decoded=JSON.parse(raw)}catch{continue}
            if(typeof decoded!=="string")continue;
            const matches=patterns.filter(x=>decoded.toLowerCase().includes(x.toLowerCase()));
            if(!matches.length)continue;
            const normalized=decoded.replace(/(?:https?:\/\/)[^\s"'<>]+/g,'[url]')
             .replace(/[a-zA-Z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}/gi,'[email]')
             .replace(/\b\d{8,}\b/g,'[digits]');
            if(output++<100)console.log("LEX_ENCODED_UI "+JSON.stringify({index:m.index,text:normalized.slice(0,400),matches}));
          }
          for(const term of ['function mainMenu()','function sectionMenu(','function sendReferral','function showReferral','async function handleUpdate']){
            const i=s.indexOf(term);
            console.log('LEX_FUNC '+JSON.stringify({term,found:i>=0,index:i}));
          }
          NODE
