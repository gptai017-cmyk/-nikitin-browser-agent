name: FPG Readonly Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fpg-readonly-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Audit incomplete FPG sections
        env:
          FPG_LOGIN: ${{ secrets.FPG_LOGIN }}
          FPG_PASSWORD: ${{ secrets.FPG_PASSWORD }}
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";
          const appId="8546be37-971f-4a0f-ba12-af9876ee6d0f";
          const base="https://xn--80afcdbalict6afooklqi5o.xn--p1ai";
          const urls={
            about:`${base}/application/about-project?applicationId=${appId}`,
            team:`${base}/application/applicationteam?applicationId=${appId}`,
            org:`${base}/application/applicant-organization?applicationId=${appId}`,
            budget:`${base}/application/budget-section/budget?applicationId=${appId}`,
            confirm:`${base}/application/confirm?applicationId=${appId}`
          };
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({locale:"ru-RU"});
          const page=await context.newPage();
          page.setDefaultTimeout(12000);

          async function nav(url){
            try{await page.goto(url,{waitUntil:"commit",timeout:30000});}catch(e){console.log("NAV_WARN",String(e?.message||e).slice(0,250));}
            await page.waitForTimeout(2500);
          }
          async function loginIfNeeded(){
            const pw=page.locator('input[type="password"]').first();
            if(!(await pw.count().catch(()=>0))) return false;
            const login=page.locator('input[type="email"],input[name*="login" i],input[name*="email" i],input[type="text"]').first();
            if(!(await login.count().catch(()=>0))) return false;
            await login.fill(process.env.FPG_LOGIN||""); await pw.fill(process.env.FPG_PASSWORD||"");
            const b=page.locator('button[type="submit"]').first();
            const named=page.getByRole('button',{name:/войти|вход|sign in|login/i}).first();
            if(await named.count().catch(()=>0)) await named.click(); else if(await b.count().catch(()=>0)) await b.click();
            await page.waitForTimeout(3500); return true;
          }
          await nav(urls.about); await loginIfNeeded(); if(!page.url().includes("application")) await nav(urls.about);

          async function inspect(kind,url){
            await nav(url);
            return await page.evaluate((kind)=>{
              const norm=v=>String(v||"").replace(/\s+/g," ").trim();
              const visible=el=>{if(!el)return false;const s=getComputedStyle(el),r=el.getBoundingClientRect();return s.display!=="none"&&s.visibility!=="hidden"&&r.width>1&&r.height>1;};
              const body=norm(document.body?.innerText||"");
              const controls=[...document.querySelectorAll("input,textarea,select,ng-select,.ng-select,[role='combobox']")]
                .filter(visible).map((el,idx)=>{
                  let root=el,ctx="";
                  for(let up=0;up<6&&root;up++,root=root.parentElement){
                    const t=norm(root.innerText||root.textContent||"");
                    if(t && t.length<850){ctx=t;break;}
                  }
                  let val="";
                  if("value" in el) val=String(el.value||"");
                  else val=norm(el.innerText||el.textContent||"");
                  return {idx,tag:el.tagName.toLowerCase(),type:el.getAttribute("type")||"",name:el.getAttribute("name")||el.getAttribute("formcontrolname")||"",placeholder:el.getAttribute("placeholder")||"",value:val.slice(0,700),checked:"checked" in el?!!el.checked:undefined,disabled:!!el.disabled,ctx:ctx.slice(0,700)};
                });
              const empty=controls.filter(x=>!x.disabled && !x.value && !["hidden","checkbox","radio","file"].includes(x.type));
              const result={kind,title:document.title,url:location.href,body:body.slice(0,30000),controls:controls.slice(0,220),emptyControls:empty.slice(0,120)};
              if(kind==="team"){
                const cards=[...document.querySelectorAll(".person-info__item,[class*='person-info__item']")].filter(visible);
                result.cards=cards.map((card,i)=>({
                  i:i+1,
                  text:norm(card.innerText||card.textContent||"").slice(0,7000),
                  fields:[...card.querySelectorAll("input,textarea,select,ng-select,.ng-select,[role='combobox']")].filter(visible).map((el,j)=>({
                    j,tag:el.tagName.toLowerCase(),type:el.getAttribute("type")||"",name:el.getAttribute("name")||el.getAttribute("formcontrolname")||"",placeholder:el.getAttribute("placeholder")||"",value:("value" in el?String(el.value||""):norm(el.innerText||el.textContent||"")).slice(0,1000)
                  }))
                }));
              }
              return result;
            },kind);
          }

          const out={};
          out.team=await inspect("team",urls.team);
          out.org=await inspect("org",urls.org);
          out.about=await inspect("about",urls.about);
          out.budget=await inspect("budget",urls.budget);
          out.confirm=await inspect("confirm",urls.confirm);
          console.log("FPG_DETAIL_JSON "+JSON.stringify(out));
          await browser.close();
          NODE
