name: FPG Readonly Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fpg-readonly-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Audit current FPG application
        env:
          FPG_LOGIN: ${{ secrets.FPG_LOGIN }}
          FPG_PASSWORD: ${{ secrets.FPG_PASSWORD }}
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";

          const startUrl = "https://xn--80afcdbalict6afooklqi5o.xn--p1ai/application/about-project?applicationId=8546be37-971f-4a0f-ba12-af9876ee6d0f";
          const appId = "8546be37-971f-4a0f-ba12-af9876ee6d0f";
          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext({locale:"ru-RU"});
          const page = await context.newPage();
          page.setDefaultTimeout(12000);

          async function nav(url) {
            try {
              await page.goto(url,{waitUntil:"commit",timeout:30000});
            } catch (e) {
              console.log("NAV_WARN", url, String(e?.message||e).slice(0,300));
            }
            await page.waitForTimeout(2500);
          }

          async function loginIfNeeded() {
            const pw = page.locator('input[type="password"]').first();
            if (!(await pw.count().catch(()=>0))) return false;
            const sels = ['input[type="email"]','input[name*="login" i]','input[name*="email" i]','input[type="text"]'];
            let login = null;
            for (const sel of sels) {
              const loc = page.locator(sel).first();
              if (await loc.count().catch(()=>0)) { login = loc; break; }
            }
            if (!login) return false;
            await login.fill(process.env.FPG_LOGIN || "");
            await pw.fill(process.env.FPG_PASSWORD || "");
            const b1 = page.getByRole('button',{name:/войти|вход|sign in|login/i}).first();
            const b2 = page.locator('button[type="submit"]').first();
            if (await b1.count().catch(()=>0)) await b1.click();
            else if (await b2.count().catch(()=>0)) await b2.click();
            else return false;
            await page.waitForTimeout(3500);
            return true;
          }

          await nav(startUrl);
          await loginIfNeeded();
          if (!page.url().includes("application")) {
            await nav(startUrl);
          }

          const landing = await page.evaluate((appId) => {
            const norm=v=>String(v||"").replace(/\s+/g," ").trim();
            const visible=el=>{const s=getComputedStyle(el),r=el.getBoundingClientRect();return s.display!=="none"&&s.visibility!=="hidden"&&r.width>1&&r.height>1;};
            const links=[...document.querySelectorAll("a")].filter(visible).map(a=>({
              text:norm(a.innerText||a.textContent||"").slice(0,180),
              href:a.href||""
            })).filter(x=>x.href.includes("/application/")&&x.href.includes(appId));
            const buttons=[...document.querySelectorAll("button")].filter(visible).map(b=>norm(b.innerText||b.textContent||"")).filter(Boolean).slice(0,80);
            const body=norm(document.body?.innerText||"");
            return {
              title:document.title,url:location.href,
              percents:[...new Set(body.match(/\b\d{1,3}%/g)||[])],
              links:[...new Map(links.map(x=>[x.href,x])).values()],
              buttons,
              bodyHead:body.slice(0,5000)
            };
          }, appId);

          const candidateUrls = landing.links.map(x=>x.href);
          if (!candidateUrls.includes(startUrl)) candidateUrls.unshift(startUrl);
          const urls=[...new Set(candidateUrls)].slice(0,30);
          const sections=[];

          for (const url of urls) {
            await nav(url);
            const info = await page.evaluate(() => {
              const norm=v=>String(v||"").replace(/\s+/g," ").trim();
              const visible=el=>{const s=getComputedStyle(el),r=el.getBoundingClientRect();return s.display!=="none"&&s.visibility!=="hidden"&&r.width>1&&r.height>1;};
              const body=norm(document.body?.innerText||"");
              const req=[...document.querySelectorAll("input,textarea,select")].filter(visible).filter(el=>el.required||el.getAttribute("aria-required")==="true");
              const emptyReq=req.filter(el=>!String(el.value||"").trim()).map(el=>({
                tag:el.tagName.toLowerCase(),
                name:el.getAttribute("name")||el.getAttribute("formcontrolname")||"",
                placeholder:el.getAttribute("placeholder")||""
              }));
              const invalid=[...document.querySelectorAll("[aria-invalid='true'],.ng-invalid.ng-touched,.invalid-feedback,.field-error,.form-error,.text-danger")]
                .filter(visible).map(el=>norm(el.innerText||el.textContent||"")).filter(Boolean);
              const files=[...document.querySelectorAll('input[type="file"]')].map(el=>({
                accept:el.accept||"",multiple:el.multiple,disabled:el.disabled
              }));
              const labels=[...document.querySelectorAll("h1,h2,h3,h4,label")].filter(visible).map(el=>norm(el.innerText||el.textContent||"")).filter(Boolean).slice(0,80);
              return {
                title:document.title,url:location.href,
                percents:[...new Set(body.match(/\b\d{1,3}%/g)||[])],
                emptyRequiredCount:emptyReq.length,
                emptyRequired:emptyReq.slice(0,25),
                invalid:[...new Set(invalid)].slice(0,25),
                fileInputs:files,
                labels,
                body:body.slice(0,6500)
              };
            });
            sections.push(info);
          }

          console.log("FPG_AUDIT_JSON "+JSON.stringify({landing,sections}));
          await browser.close();
          NODE
