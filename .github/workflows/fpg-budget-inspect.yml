name: FPG budget read only inspect
on:
  push:
    branches: [main]
    paths: [".github/workflows/fpg-budget-inspect.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install chromium
      - name: Inspect current budget
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FPG_LOGIN: ${{ secrets.FPG_LOGIN }}
          FPG_PASSWORD: ${{ secrets.FPG_PASSWORD }}
          BROWSER_BRIDGE_URL: "https://nikitin-browser-bridge.cbd-legal-cloudflare-worker.workers.dev"
          BROWSER_TASK_PLAINTEXT: "[[BROWSER_SCOPE:GRANT]] DIRECT_JSON:{\"url\":\"https://xn--80afcdbalict6afooklqi5o.xn--p1ai/application/about-project?applicationId=8546be37-971f-4a0f-ba12-af9876ee6d0f\",\"actions\":[{\"op\":\"click_text\",\"value\":\"Бюджет\"},{\"op\":\"inspect_budget_row_dom\",\"match\":\"Фундамент, гранитные конструкции\"},{\"op\":\"inspect_budget_row_dom\",\"match\":\"Добровольческая помощь ветеранов\"}]}"
        shell: bash
        run: |
          set +e
          node src/execute-dispatch.js > /tmp/fpg-budget.log 2>&1
          RC=$?
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const s=fs.readFileSync("/tmp/fpg-budget.log","utf8");
          const x=s.indexOf("DIRECT_JSON_OUTPUT_V1");
          console.log("FPG_BUDGET_RESULT "+(x>=0?s.slice(x,x+18000):s.slice(-1600)).replace(/https?:\/\/[^\s]+/g,"[url]"));
          NODE
          echo "EXIT=$RC"
          test "$RC" -eq 0

# detail-pass: 1

# detail-pass: 2
