name: FPG Enrich Draft 2026-10-11

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fpg-enrich-20261011.yml"

permissions:
  contents: read

jobs:
  enrich:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Enrich FPG draft without submitting
        env:
          FPG_LOGIN: ${{ secrets.FPG_LOGIN }}
          FPG_PASSWORD: ${{ secrets.FPG_PASSWORD }}
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";
          import fs from "node:fs/promises";

          const appId="8546be37-971f-4a0f-ba12-af9876ee6d0f";
          const base="https://xn--80afcdbalict6afooklqi5o.xn--p1ai";
          const urls={
            about:base+"/application/about-project?applicationId="+appId,
            team:base+"/application/applicationteam?applicationId="+appId,
            org:base+"/application/applicant-organization?applicationId="+appId,
            calendar:base+"/application/action-plan?applicationId="+appId
          };

          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({locale:"ru-RU",viewport:{width:1440,height:1000}});
          const page=await context.newPage();
          page.setDefaultTimeout(12000);
          const log=(k,v)=>console.log("FPG_ENRICH "+k+" "+(typeof v==="string"?v:JSON.stringify(v)));

          async function nav(url){
            let last="";
            for(let n=1;n<=6;n++){
              try{
                const resp=await page.goto(url,{waitUntil:"commit",timeout:30000});
                await page.waitForTimeout(2500);
                const body=(await page.locator("body").innerText().catch(()=>"")).trim();
                if(page.url()!=="about:blank" && body.length>200){
                  log("NAV",{try:n,status:resp?.status()??null,url:page.url(),title:await page.title()});
                  return;
                }
                last="empty body";
              }catch(e){last=String(e?.message||e).slice(0,260);}
              await page.waitForTimeout(1800*n);
            }
            throw new Error("NAV_FAILED "+url+" "+last);
          }

          async function loginIfNeeded(){
            const pw=page.locator('input[type="password"]').first();
            if(!(await pw.count().catch(()=>0))) return;
            const login=page.locator('input[type="email"],input[name*="login" i],input[name*="email" i],input[type="text"]').first();
            if(!(await login.count().catch(()=>0))) return;
            await login.fill(process.env.FPG_LOGIN||"");
            await pw.fill(process.env.FPG_PASSWORD||"");
            const named=page.getByRole("button",{name:/войти|вход|sign in|login/i}).first();
            if(await named.count().catch(()=>0)) await named.click();
            else await page.locator('button[type="submit"]').first().click();
            await page.waitForTimeout(4000);
            log("LOGIN","done");
          }

          async function openApp(url){
            await nav(url);
            await loginIfNeeded();
            if(!page.url().includes("/application/")) await nav(url);
          }

          async function fill(loc,val){
            if(!(await loc.count().catch(()=>0))) throw new Error("FIELD_NOT_FOUND");
            const el=loc.first();
            await el.scrollIntoViewIfNeeded().catch(()=>{});
            await el.fill(String(val),{timeout:15000});
            await el.evaluate(e=>{
              e.dispatchEvent(new Event("input",{bubbles:true}));
              e.dispatchEvent(new Event("change",{bubbles:true}));
              e.dispatchEvent(new Event("blur",{bubbles:true}));
            }).catch(()=>{});
            await page.waitForTimeout(650);
          }

          async function choose(sel,wanted,custom=false){
            if(!(await sel.count().catch(()=>0))) return {ok:false,error:"missing"};
            const loc=sel.first();
            await loc.scrollIntoViewIfNeeded().catch(()=>{});
            await loc.click({force:true});
            await page.waitForTimeout(350);
            const opts=page.locator(".ng-dropdown-panel .ng-option:visible,[role='option']:visible");
            const n=await opts.count().catch(()=>0);
            const texts=[];
            for(let i=0;i<n;i++){
              const it=opts.nth(i);
              const t=String(await it.innerText().catch(()=>"")).replace(/\s+/g," ").trim();
              texts.push(t);
              if(t===wanted || t.includes(wanted)){
                await it.click({force:true});
                await page.waitForTimeout(600);
                return {ok:true,picked:t};
              }
            }
            if(custom){
              const inp=loc.locator("input").first();
              if(await inp.count().catch(()=>0)){
                await inp.fill(wanted);
                await page.keyboard.press("Enter");
                await page.waitForTimeout(600);
                return {ok:true,picked:wanted,custom:true};
              }
            }
            await page.keyboard.press("Escape").catch(()=>{});
            return {ok:false,options:texts.slice(0,80)};
          }

          async function additionalByCard(card,text){
            const token="extra-"+Math.random().toString(36).slice(2);
            const ok=await card.evaluate((root,token)=>{
              const norm=v=>String(v||"").replace(/\s+/g," ").trim().toLowerCase();
              const vis=el=>{const s=getComputedStyle(el),r=el.getBoundingClientRect();return s.display!=="none"&&s.visibility!=="hidden"&&r.width>1&&r.height>1;};
              const heads=[...root.querySelectorAll("div,p,label,span,h3,h4")].filter(vis);
              const h=heads.find(el=>/6\.\s*дополнительные сведения/i.test(norm(el.innerText||el.textContent||"")));
              if(!h)return false;
              const tas=[...root.querySelectorAll("textarea")].filter(vis);
              const after=tas.filter(el=>(h.compareDocumentPosition(el)&Node.DOCUMENT_POSITION_FOLLOWING));
              const target=after.find(el=>!(el.getAttribute("placeholder")||""))||after[0];
              if(!target)return false;
              target.setAttribute("data-extra",token);
              return true;
            },token);
            if(!ok)return false;
            await fill(card.locator('[data-extra="'+token+'"]'),text);
            await card.evaluate((root,token)=>root.querySelector('[data-extra="'+token+'"]')?.removeAttribute("data-extra"),token).catch(()=>{});
            return true;
          }

          async function cardBySurname(surname){
            const cards=page.locator(".person-info__item,[class*='person-info__item']");
            const n=await cards.count();
            for(let i=0;i<n;i++){
              const c=cards.nth(i);
              const v=await c.locator('input[placeholder="Фамилия"]').first().inputValue().catch(()=>"");
              if(v.trim().toLowerCase()===surname.toLowerCase())return c;
            }
            return null;
          }

          // ABOUT
          await openApp(urls.about);

          const goal="К 31 июля 2028 года вовлечь не менее 1 500 подростков и молодых людей 12–25 лет города Пензы в системную деятельность по сохранению исторической памяти о Герое Российской Федерации В. В. Канакине и сотрудниках специальных подразделений России через постоянно действующее мемориально-просветительское пространство, цифровой архив памяти, QR-навигацию, встречи с ветеранами и тематические экскурсии.";
          const goalIdx=await page.locator("textarea").evaluateAll(els=>els.findIndex(el=>String(el.value||"").includes("1) Создать в Пензе постоянно действующее мемориально-просветительское пространство")));
          if(goalIdx>=0){
            await fill(page.locator("textarea").nth(goalIdx),goal);
            log("GOAL","updated");
          } else {
            const already=await page.locator("textarea").evaluateAll(els=>els.some(el=>String(el.value||"").includes("К 31 июля 2028 года вовлечь не менее 1 500")));
            log("GOAL",already?"already updated":"not found");
          }

          const themeText="Деятельность в сфере патриотического, в том числе военно-патриотического воспитания граждан Российской Федерации";
          const themeSel=page.locator("ng-select,.ng-select").filter({hasText:"Выбрать тематику грантового направления"}).first();
          if(await themeSel.count().catch(()=>0)) log("THEME",await choose(themeSel,themeText));

          const tagSel=page.locator("ng-select,.ng-select").filter({hasText:"Выберите один или несколько вариантов"}).first();
          if(await tagSel.count().catch(()=>0)){
            await tagSel.click({force:true});
            await page.waitForTimeout(350);
            const opts=(await page.locator(".ng-dropdown-panel .ng-option:visible,[role='option']:visible").allInnerTexts().catch(()=>[]))
              .map(x=>String(x).replace(/\s+/g," ").trim()).filter(Boolean);
            await page.keyboard.press("Escape").catch(()=>{});
            log("TAG_OPTIONS",opts.slice(0,100));
            const chosen=[];
            for(const re of [/патриот/i,/историческ/i,/молод[её]ж/i,/ветеран/i,/просвет/i]){
              const cand=opts.find(x=>re.test(x)&&!chosen.includes(x));
              if(cand){
                const rr=await choose(tagSel,cand);
                if(rr.ok)chosen.push(cand);
              }
            }
            log("TAGS",chosen);
          }

          const partner=page.locator('textarea[placeholder="Партнер"]').first();
          if(await partner.count().catch(()=>0)){
            const cur=await partner.inputValue().catch(()=>"");
            if(!cur.trim()) await fill(partner,'Благотворительный фонд «Альфа»');
          }
          const supportSel=page.locator("ng-select,.ng-select").filter({hasText:"Вид поддержки"}).first();
          if(await supportSel.count().catch(()=>0)){
            log("PARTNER_SUPPORT",await choose(supportSel,"информационная, просветительская и организационная поддержка",true));
          }

          const aboutText=await page.locator("body").innerText().catch(()=>"");
          if(!aboutText.includes("fpg-evidence-obosnovanie-aktualnosti.pdf")){
            try{
              const resp=await fetch("https://memorial58.ru/files/%D0%9E%D0%B1%D0%BE%D1%81%D0%BD%D0%BE%D0%B2%D0%B0%D0%BD%D0%B8%D0%B5.pdf");
              const buf=Buffer.from(await resp.arrayBuffer());
              if(resp.ok&&buf.length>1000){
                const p="/tmp/fpg-evidence-obosnovanie-aktualnosti.pdf";
                await fs.writeFile(p,buf);
                const inputs=page.locator('input[type="file"]');
                const n=await inputs.count();
                let target=null;
                for(let i=0;i<n;i++){
                  const inp=inputs.nth(i);
                  const accept=String(await inp.getAttribute("accept")||"").toLowerCase();
                  if(accept.includes("ppt")||accept.includes("xlsx")||accept.includes("jpg")){target=inp;break;}
                }
                if(target){
                  await target.setInputFiles(p,{timeout:90000});
                  await page.waitForTimeout(6500);
                  log("EVIDENCE_UPLOAD",{bytes:buf.length});
                }
              }
            }catch(e){log("EVIDENCE_ERROR",String(e?.message||e));}
          }

          // TEAM
          await openApp(urls.team);

          let c=await cardBySurname("Никитин");
          if(c){
            const eds=c.locator('textarea[placeholder="Образовательная организация"]');
            const n=await eds.count();
            for(let i=0;i<n;i++){
              const ed=eds.nth(i);
              const cur=await ed.inputValue().catch(()=>"");
              if(cur==="Игоревич"||(!cur.trim()&&i===0)){
                await fill(ed,"Пензенская государственная технологическая академия");
                let root=ed;
                for(let up=0;up<7;up++){
                  const ys=root.locator('input[placeholder="Год начала"]').first();
                  const ye=root.locator('input[placeholder="Год окончания"]').first();
                  if(await ys.count().catch(()=>0)&&await ye.count().catch(()=>0)){
                    if(!(await ys.inputValue()).trim())await fill(ys,"2003");
                    if(!(await ye.inputValue()).trim())await fill(ye,"2008");
                    break;
                  }
                  root=root.locator("xpath=..");
                }
                break;
              }
            }
            await additionalByCard(c,"Первый заместитель председателя Пензенской региональной общественной организации «Лига ветеранов службы по борьбе с организованной преступностью». В проекте отвечает за координацию подрядчиков, архитектурной и цифровой частей, взаимодействие с партнёрами и организацию реализации мемориально-просветительского пространства. Имеет опыт предпринимательской и проектной деятельности.");
            log("TEAM_NIKITIN","updated");
          }

          c=await cardBySurname("Зейкан");
          if(c){
            await additionalByCard(c,"Подполковник милиции в отставке, председатель Пензенской региональной общественной организации «Лига ветеранов службы по борьбе с организованной преступностью». Член Общественного совета при УМВД России по Пензенской области, участник проектов духовно-нравственного и патриотического воспитания молодёжи. Президент Федерации панкратиона Пензенской области; имеет опыт организации памятных, спортивно-патриотических и общественных мероприятий.");
            log("TEAM_ZEIKAN","updated");
          }

          c=await cardBySurname("Полишко");
          if(c){
            await additionalByCard(c,"Архитектор с опытом градостроительного проектирования и работы в органах архитектуры города Пензы. В разные годы занимал должность главного архитектора города Пензы. В проекте отвечает за архитектурную концепцию, пространственные решения и увязку мемориальных элементов.");
            log("TEAM_POLISHKO","updated");
          }

          c=await cardBySurname("Деряпкина");
          if(c){
            await additionalByCard(c,"Разработчик и специалист по наполнению сайта memorial58.ru. В проекте отвечает за цифровую платформу, размещение и структурирование материалов цифрового архива, техническое сопровождение публикаций и QR-навигации.");
            log("TEAM_DERYAPKINA","updated");
          }

          c=await cardBySurname("Маркина");
          if(c){
            await additionalByCard(c,"Имеет опыт организационного и документационного сопровождения текущей деятельности. В проекте отвечает за сбор и систематизацию документов, взаимодействие с участниками и партнёрами, подготовку подтверждающих материалов и сопровождение мероприятий.");
            log("TEAM_MARKINA","updated");
          }

          if(!(await cardBySurname("Селиванов"))){
            const add=page.getByRole("button",{name:/Добавить члена команды/i}).first();
            if(await add.count().catch(()=>0)){
              await add.click({force:true});
              await page.waitForTimeout(1200);
              let card=page.locator(".person-info__item,[class*='person-info__item']").last();
              const manual=card.getByText("Заполнить вручную",{exact:true}).first();
              if(await manual.count().catch(()=>0)){
                await manual.click({force:true});
                await page.waitForTimeout(700);
                card=page.locator(".person-info__item,[class*='person-info__item']").last();
              }
              const texts=card.locator('input[type="text"]:visible');
              const tn=await texts.count();
              for(let i=0;i<tn;i++){
                const el=texts.nth(i);
                const ph=String(await el.getAttribute("placeholder")||"");
                if(!["Фамилия","Имя","Отчество"].includes(ph)){await fill(el,"Юридическое и информационное сопровождение проекта");break;}
              }
              await fill(card.locator('input[placeholder="Фамилия"]'),"Селиванов");
              await fill(card.locator('input[placeholder="Имя"]'),"Илья");
              await fill(card.locator('input[placeholder="Отчество"]'),"Валентинович");
              const eduSel=card.locator("ng-select,.ng-select").first();
              if(await eduSel.count().catch(()=>0))await choose(eduSel,"высшее");
              const eo=card.locator('textarea[placeholder="Образовательная организация"]').first();
              if(await eo.count().catch(()=>0)){
                await fill(eo,'ЧОУ ВО «Открытый институт – Высшая профессиональная школа»');
                const es=card.locator('textarea[placeholder="Специальность"]').first();
                if(await es.count().catch(()=>0))await fill(es,"Юриспруденция");
                let root=eo;
                for(let up=0;up<7;up++){
                  const ye=root.locator('input[placeholder="Год окончания"]').first();
                  if(await ye.count().catch(()=>0)){if(!(await ye.inputValue()).trim())await fill(ye,"2017");break;}
                  root=root.locator("xpath=..");
                }
              }
              const wo=card.locator('textarea[placeholder="Организация"]').first();
              if(await wo.count().catch(()=>0)){
                await fill(wo,'ООО «Пензенский юридический центр»');
                const wp=card.locator('textarea[placeholder="Должность"]').first();
                if(await wp.count().catch(()=>0))await fill(wp,"Юрист");
                let root=wo;
                for(let up=0;up<7;up++){
                  const ys=root.locator('input[placeholder="Год начала"]').first();
                  if(await ys.count().catch(()=>0)){
                    if(!(await ys.inputValue()).trim())await fill(ys,"2019");
                    const cb=root.locator('input[type="checkbox"]').last();
                    if(await cb.count().catch(()=>0)&&!(await cb.isChecked().catch(()=>false)))await cb.check({force:true}).catch(()=>{});
                    break;
                  }
                  root=root.locator("xpath=..");
                }
              }
              await additionalByCard(card,"Юрист с опытом правового сопровождения общественных и коммерческих проектов. В 2015–2018 годах работал помощником адвоката, с 2019 года — юрист ООО «Пензенский юридический центр». Имеет опыт общественной деятельности и взаимодействия с гражданами. В проекте отвечает за правовое сопровождение, договорную работу, согласования и информационные коммуникации.");
              log("TEAM_SELIVANOV","added");
            }
          }else log("TEAM_SELIVANOV","already present");

          // ORGANIZATION: add verifiable media references only; financial declarations untouched.
          await openApp(urls.org);
          const tas=page.locator("textarea:visible");
          const tc=await tas.count();
          for(let i=0;i<tc;i++){
            const ta=tas.nth(i);
            const val=await ta.inputValue().catch(()=>"");
            if(val.trim())continue;
            const p1=await ta.locator("xpath=..").innerText().catch(()=>"");
            const p2=await ta.locator("xpath=../..").innerText().catch(()=>"");
            if(/Публикации в СМИ/i.test(p1+" "+p2)){
              await fill(ta,"Официальная публикация Управления Росгвардии по Пензенской области о проекте: https://58.rosguard.gov.ru/news/article/pri-podderzhke-rosgvardii-v-penze-vozvodyat-memorialnyj-kompleks-pamyati-geroya-rossii-valeriya-kanakina-i-pogibshix-sotrudnikov-specpodrazdelenij\nСайт проекта и подборка публикаций СМИ: https://memorial58.ru/");
              log("ORG_MEDIA","updated");
              break;
            }
          }

          // CALENDAR read-only verification.
          await openApp(urls.calendar);
          const cal=await page.evaluate(()=>{
            const t=String(document.body?.innerText||"").replace(/\s+/g," ").trim();
            const rows=[...document.querySelectorAll("tr")].map(el=>String(el.innerText||"").replace(/\s+/g," ").trim()).filter(x=>/^\d+\s/.test(x));
            return {count:rows.length,rows:rows.slice(0,30),has1500:t.includes("1 500")||t.includes("1500"),mentions20:/20 (?:встреч|мероприятий|экскурсий)/i.test(t)};
          });
          log("CALENDAR",cal);

          // Safe verify, no submit/sign.
          await openApp(urls.about);
          const verify=await page.evaluate(()=>{
            const body=String(document.body?.innerText||"").replace(/\s+/g," ").trim();
            const vals=[...document.querySelectorAll("textarea")].map(x=>String(x.value||""));
            return {
              goal:vals.some(v=>v.includes("К 31 июля 2028 года вовлечь не менее 1 500")),
              partner:vals.some(v=>v.includes("Благотворительный фонд «Альфа»")),
              evidence:body.includes("fpg-evidence-obosnovanie-aktualnosti.pdf"),
              title:document.title
            };
          });
          log("VERIFY",verify);

          await browser.close();
          NODE
