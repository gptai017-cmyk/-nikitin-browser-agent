name: FPG Direct Inspect
on:
  push:
    branches: [main]
    paths: [".github/workflows/fpg-direct-inspect.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: "npm"}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Inspect about selectors
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FPG_LOGIN: ${{ secrets.FPG_LOGIN }}
          FPG_PASSWORD: ${{ secrets.FPG_PASSWORD }}
          BROWSER_BRIDGE_URL: "https://nikitin-browser-bridge.cbd-legal-cloudflare-worker.workers.dev"
          BROWSER_TASK_PLAINTEXT: >-
            DIRECT_JSON:{"url":"https://xn--80afcdbalict6afooklqi5o.xn--p1ai/application/about-project?applicationId=8546be37-971f-4a0f-ba12-af9876ee6d0f","actions":[{"op":"inspect_block_compact","match":"1.1. Тематика грантового направления"},{"op":"inspect_block_compact","match":"3.3. Теги"},{"op":"inspect_text_near","match":"1.1. Тематика грантового направления"},{"op":"inspect_text_near","match":"3.3. Теги"}],"reload":false}
        run: node src/execute-dispatch.js
