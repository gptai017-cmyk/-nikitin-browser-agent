name: Remove Temporary FPG Relay
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/remove-fpg-relay.yml"
permissions:
  contents: read
jobs:
  remove:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Delete temporary relay worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ead717e4aeccf34fc50aa3832f12221f
        run: npx --yes wrangler@4.41.0 delete nikitin-fpg-relay-temp --force
