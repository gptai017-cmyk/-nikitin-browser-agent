name: Inspect outdated Telegram rewards and section deep-link handlers
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-telegram-legacy-rewards.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT: ead717e4aeccf34fc50aa3832f12221f
    steps:
      - name: Inspect sanitized code surroundings of legacy messages and links
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN"
          curl -fsS --max-time 40 -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/cbd-legal-advokat4u" -o /tmp/lex-legacy-source
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const blob=fs.readFileSync('/tmp/lex-legacy-source','utf8');
          const boundary=blob.split(/\r?\n/,1)[0];
          const marker='Content-Disposition: form-data; name="index.js"\r\n\r\n';
          const a=blob.indexOf(marker)+marker.length,b=blob.indexOf('\r\n'+boundary,a);
          if(a<marker.length||b<0)throw Error('multipart_invalid');
          const s=blob.slice(a,b);
          console.log('CODE_LENGTH '+s.length);
          const keywords=['25 ⭐','25🌟','25 звёзд','25 звезд','подарок','подар','start=ref_','ref_','invite','referral','/start','mainMenu()','LEX_SECURITY_MENU_2026_11_05','Обменять','звёзд'];
          for(const word of keywords){
           const low=s.toLowerCase(),needle=word.toLowerCase();
           const offsets=[];let idx=-1;while((idx=low.indexOf(needle,idx+1))>=0 && offsets.length<12)offsets.push(idx);
           console.log('ANCHOR '+JSON.stringify({word,count:offsets.length,offsets:offsets.slice(0,12)}));
           for(const i of offsets.slice(0,3)){
            let excerpt=s.slice(Math.max(0,i-280),Math.min(s.length,i+470));
            excerpt=excerpt.replace(/https?:\/\/[^\s"'<>]+/gi,'[url]').replace(/\b(?:\d{8,}|[A-Fa-f0-9]{32,})\b/g,'[redacted]');
            console.log('EXCERPT '+JSON.stringify({word,text:excerpt}));
           }
          }
          for(const start of ['function mainMenu() {','function handleStart(','async function handleMessage(','async function handleCallback(']){
           let i=s.indexOf(start);console.log('STRUCT '+JSON.stringify({start,pos:i,excerpt:i>=0?s.slice(i,i+850).replace(/https?:\/\/[^\s"'<>]+/gi,'[url]'):null}));
          }
          NODE
