name: FPG private cabinet access probe
on:
  push:
    branches: [main]
    paths: [".github/workflows/fpg-cabinet-probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install chromium
      - name: Read-only FPG cabinet access via existing browser agent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FPG_LOGIN: ${{ secrets.FPG_LOGIN }}
          FPG_PASSWORD: ${{ secrets.FPG_PASSWORD }}
          BROWSER_BRIDGE_URL: "https://nikitin-browser-bridge.cbd-legal-cloudflare-worker.workers.dev"
          BROWSER_TASK_PLAINTEXT: >-
            [[BROWSER_SCOPE:GRANT]] DIRECT_JSON:{"url":"https://xn--80afcdbalict6afooklqi5o.xn--p1ai/application/about-project?applicationId=8546be37-971f-4a0f-ba12-af9876ee6d0f","actions":[{"op":"inspect_buttons"},{"op":"inspect_fpg_narrative_brief"},{"op":"inspect_text_near","match":"Память поколениям"},{"op":"inspect_errors"}]}
        shell: bash
        run: |
          set +e
          node src/execute-dispatch.js > /tmp/fpg-probe-private.log 2>&1
          RC=$?
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const s=fs.readFileSync("/tmp/fpg-probe-private.log","utf8");
          const direct=s.includes("DIRECT_JSON_OUTPUT_V1");
          const login=s.includes("DIRECT_JSON_LOGIN_REQUIRED")||s.includes("MISSING_FPG_LOGIN")||s.includes("MISSING_FPG_PASSWORD");
          const maintenance=/Технические работы|Портал временно недоступен|503 Service Unavailable/i.test(s);
          const hasGoal=direct && /Цель проекта|Описание проекта|Название проекта/.test(s);
          const err=(s.match(/(?:Error:|DIRECT_[A-Z_]+)[^\n]{0,180}/)||[])[0]||"";
          console.log("FPG_PRIVATE_PROBE "+JSON.stringify({direct,login,maintenance,hasGoal,error:err.replace(/https?:\/\/[^\s]+/g,"[url]").slice(0,140)}));
          const access=(s.match(/FPG_ACCESS_DIAG [^\n]+/)||[])[0]||""; console.log(access); const diag=s.split("\\n").filter(x=>/Error|PUSH_TASK|DIRECT_JSON|FAILED|timeout|denied|net::/i.test(x)).slice(-6).map(x=>x.replace(/https?:\/\/[^\s]+/g,"[url]").replace(/[A-Za-z0-9_-]{50,}/g,"[redacted]").slice(0,220));
          console.log("FPG_DIAG "+JSON.stringify(diag));
          console.log("FPG_TAIL "+s.slice(-11000).replace(/https?:\/\/[^\s]+/g,"[url]").replace(/[A-Za-z0-9_-]{50,}/g,"[redacted]"));
          NODE
          echo "RUN_EXIT=$RC"
# probe-marker: 11
