name: Nikitin Browser Agent

on:
  push:
    branches: [main]
    paths: [".github/workflows/bootstrap.yml"]

  workflow_dispatch:
    inputs:
      payload:
        description: "Encrypted Telegram task"
        required: false
        type: string

permissions:
  contents: write

jobs:
  deploy:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.payload == '')
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail

          R="$(curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            https://api.cloudflare.com/client/v4/accounts)"

          ID="$(printf '%s' "$R" | jq -r '.result[0].id // empty')"

          if [ -z "$ID" ]; then
            echo "Cloudflare account ID not found."
            printf '%s' "$R" | jq '{success,errors,result_info}'
            exit 1
          fi

          echo "CLOUDFLARE_ACCOUNT_ID=$ID" >> "$GITHUB_ENV"

      - name: Generate AI browser agent
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p worker/src src

          cat > wrangler.jsonc <<'EOF'
          {
            "$schema": "node_modules/wrangler/config-schema.json",
            "name": "nikitin-browser-bridge",
            "main": "worker/src/index.js",
            "compatibility_date": "2026-10-05",
            "workers_dev": true,
            "ai": {
              "binding": "AI"
            }
          }
          EOF

          cat > worker/src/index.js <<'EOF'
          const te = new TextEncoder();
          const MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast";

          const json = (data, status = 200) =>
            new Response(JSON.stringify(data), {
              status,
              headers: {
                "content-type": "application/json; charset=utf-8"
              }
            });

          function same(a = "", b = "") {
            if (a.length !== b.length) return false;

            let x = 0;

            for (let i = 0; i < a.length; i++) {
              x |= a.charCodeAt(i) ^ b.charCodeAt(i);
            }

            return x === 0;
          }

          async function sha256Hex(value) {
            const bytes = new Uint8Array(
              await crypto.subtle.digest(
                "SHA-256",
                te.encode(value)
              )
            );

            return [...bytes]
              .map((x) => x.toString(16).padStart(2, "0"))
              .join("");
          }

          async function hmac(secret, value) {
            const key = await crypto.subtle.importKey(
              "raw",
              te.encode(secret),
              {
                name: "HMAC",
                hash: "SHA-256"
              },
              false,
              ["sign"]
            );

            const sig = new Uint8Array(
              await crypto.subtle.sign(
                "HMAC",
                key,
                te.encode(String(value))
              )
            );

            return [...sig]
              .map((x) => x.toString(16).padStart(2, "0"))
              .join("");
          }

          function b64(bytes) {
            let s = "";

            for (const x of bytes) {
              s += String.fromCharCode(x);
            }

            return btoa(s);
          }

          async function encrypt(value, secret) {
            const raw = await crypto.subtle.digest(
              "SHA-256",
              te.encode(secret)
            );

            const key = await crypto.subtle.importKey(
              "raw",
              raw,
              "AES-GCM",
              false,
              ["encrypt"]
            );

            const iv = crypto.getRandomValues(
              new Uint8Array(12)
            );

            const ct = new Uint8Array(
              await crypto.subtle.encrypt(
                {
                  name: "AES-GCM",
                  iv
                },
                key,
                te.encode(JSON.stringify(value))
              )
            );

            const packed = new Uint8Array(
              iv.length + ct.length
            );

            packed.set(iv);
            packed.set(ct, iv.length);

            return b64(packed);
          }

          async function tg(env, chatId, text) {
            const r = await fetch(
              `https://api.telegram.org/bot${env.TELEGRAM_BOT_TOKEN}/sendMessage`,
              {
                method: "POST",
                headers: {
                  "content-type": "application/json"
                },
                body: JSON.stringify({
                  chat_id: chatId,
                  text,
                  disable_web_page_preview: true
                })
              }
            );

            const j = await r.json();

            if (!j.ok) {
              throw new Error(
                j.description || "Telegram API error"
              );
            }
          }

          async function dispatch(env, payload) {
            const r = await fetch(
              `https://api.github.com/repos/${env.GITHUB_REPO}/actions/workflows/bootstrap.yml/dispatches`,
              {
                method: "POST",
                headers: {
                  accept: "application/vnd.github+json",
                  authorization: `Bearer ${env.GH_PAT}`,
                  "content-type": "application/json",
                  "user-agent": "nikitin-browser-bridge",
                  "x-github-api-version": "2022-11-28"
                },
                body: JSON.stringify({
                  ref: "main",
                  inputs: {
                    payload
                  }
                })
              }
            );

            if (!r.ok) {
              throw new Error(
                `GitHub dispatch failed: ${r.status}`
              );
            }
          }

          async function aiDecision(env, body) {
            const schema = {
              type: "object",
              properties: {
                action: {
                  type: "string",
                  enum: [
                    "click",
                    "type",
                    "press",
                    "select",
                    "scroll",
                    "goto",
                    "back",
                    "wait",
                    "finish",
                    "ask_confirmation"
                  ]
                },
                target_id: {
                  type: "string"
                },
                value: {
                  type: "string"
                },
                answer: {
                  type: "string"
                }
              },
              required: [
                "action",
                "target_id",
                "value",
                "answer"
              ]
            };

            const system = `
          You are a browser-control agent.

          You receive a user task plus the current browser state.
          Return exactly one next action as structured JSON.

          Rules:

          1. Never invent a target_id.
             Use only ids visible in state.elements.

          2. Prefer click, type, select and press on listed elements.

          3. Use goto only for a clearly appropriate http/https URL.

          4. If the task is already complete, use finish and put a concise useful answer in answer.

          5. If a site asks for CAPTCHA, 2FA, a one-time code, or human verification,
             use finish and explain that the user must complete it manually.

          6. Before any consequential action such as:
             purchase,
             payment,
             order,
             sending or submitting a form or message,
             publishing,
             posting,
             deletion,
             signing,
             account changes,
             or final confirmation,
             use ask_confirmation unless state.confirmed is true.

          7. Routine navigation, search, opening pages, accepting cookie banners,
             scrolling and reading are not consequential.

          8. Keep the final answer in the user's language.

          9. Never expose secrets.

          10. For search boxes, type the search query first and press Enter in a later step.

          11. If an action failed, inspect the new state and try another safe approach.

          12. Do not attempt to bypass access controls, CAPTCHA, anti-bot protection,
              authentication security or other technical restrictions.
          `;

            const result = await env.AI.run(
              MODEL,
              {
                messages: [
                  {
                    role: "system",
                    content: system
                  },
                  {
                    role: "user",
                    content: JSON.stringify(body)
                  }
                ],
                response_format: {
                  type: "json_schema",
                  json_schema: schema
                },
                temperature: 0.1,
                max_tokens: 420
              }
            );

            let decision =
              result?.response ?? result;

            if (typeof decision === "string") {
              try {
                decision =
                  JSON.parse(decision);
              } catch {
                const m =
                  decision.match(
                    /\{[\s\S]*\}/
                  );

                if (!m) {
                  throw new Error(
                    "AI returned invalid JSON"
                  );
                }

                decision =
                  JSON.parse(m[0]);
              }
            }

            return decision;
          }

          export default {
            async fetch(request, env) {
              const u =
                new URL(request.url);

              if (
                request.method === "GET" &&
                u.pathname === "/health"
              ) {
                return json({
                  ok: true,
                  service:
                    "nikitin-browser-bridge",
                  ai: Boolean(env.AI)
                });
              }

              if (
                request.method === "POST" &&
                u.pathname === "/ai"
              ) {
                const supplied =
                  request.headers.get(
                    "X-Agent-Key"
                  ) || "";

                const expected =
                  await sha256Hex(
                    `browser-ai:${env.TELEGRAM_BOT_TOKEN}`
                  );

                if (
                  !same(
                    supplied,
                    expected
                  )
                ) {
                  return json(
                    {
                      ok: false,
                      error: "forbidden"
                    },
                    403
                  );
                }

                try {
                  const body =
                    await request.json();

                  const decision =
                    await aiDecision(
                      env,
                      body
                    );

                  return json({
                    ok: true,
                    decision
                  });
                } catch (e) {
                  return json(
                    {
                      ok: false,
                      error: String(
                        e?.message || e
                      )
                    },
                    500
                  );
                }
              }

              if (
                request.method !== "POST" ||
                u.pathname !== "/telegram"
              ) {
                return json(
                  {
                    ok: false,
                    error: "not_found"
                  },
                  404
                );
              }

              const secret =
                request.headers.get(
                  "X-Telegram-Bot-Api-Secret-Token"
                ) || "";

              if (
                !env.WEBHOOK_SECRET ||
                !same(
                  secret,
                  env.WEBHOOK_SECRET
                )
              ) {
                return json(
                  {
                    ok: false,
                    error: "forbidden"
                  },
                  403
                );
              }

              let update;

              try {
                update =
                  await request.json();
              } catch {
                return json(
                  {
                    ok: false,
                    error: "invalid_json"
                  },
                  400
                );
              }

              const chatId =
                update?.message?.chat?.id;

              const text =
                String(
                  update?.message?.text || ""
                ).trim();

              if (
                !chatId ||
                !text
              ) {
                return json({
                  ok: true,
                  ignored: true
                });
              }

              const owner =
                await hmac(
                  env.TELEGRAM_BOT_TOKEN,
                  chatId
                );

              if (
                !env.OWNER_HASH ||
                !same(
                  owner,
                  env.OWNER_HASH
                )
              ) {
                return json({
                  ok: true,
                  ignored: true
                });
              }

              if (
                text.startsWith("/start") ||
                text.startsWith("/help")
              ) {
                await tg(
                  env,
                  chatId,
                  "✅ Nikitin Browser Agent работает.\n\n" +
                  "Можно писать обычным языком, например:\n" +
                  "• Открой сайт Росреестра и найди публичную карту\n" +
                  "• Найди на сайте цену тарифа и пришли результат\n" +
                  "• Перейди по ссылке, открой раздел Контакты и сделай скриншот\n\n" +
                  "Служебные команды:\n" +
                  "/shot URL\n" +
                  "/text URL\n" +
                  "/open URL\n\n" +
                  "Перед отправкой форм, покупкой, удалением, публикацией и другими необратимыми действиями агент остановится и попросит подтверждение."
                );

                return json({
                  ok: true,
                  handled: "help"
                });
              }

              const payload =
                await encrypt(
                  {
                    task: text,
                    chat_id:
                      String(chatId),
                    update_id:
                      String(
                        update?.update_id ??
                        ""
                      ),
                    bridge_url:
                      u.origin
                  },
                  env.TELEGRAM_BOT_TOKEN
                );

              try {
                await dispatch(
                  env,
                  payload
                );

                await tg(
                  env,
                  chatId,
                  "⏳ Принял. Запускаю облачный браузер…"
                );

                return json({
                  ok: true,
                  dispatched: true
                });
              } catch (e) {
                await tg(
                  env,
                  chatId,
                  "❌ Не удалось запустить браузерную задачу."
                );

                return json(
                  {
                    ok: false,
                    error: String(
                      e?.message || e
                    )
                  },
                  502
                );
              }
            }
          };
          EOF

          cat > src/execute-dispatch.js <<'EOF'
          import {
            createDecipheriv,
            createHash,
            createHmac,
            timingSafeEqual
          } from "node:crypto";

          import fs from "node:fs/promises";
          import { chromium } from "playwright";

          const token =
            process.env.TELEGRAM_BOT_TOKEN;

          const packedInput =
            process.env.BRIDGE_PAYLOAD;

          if (
            !token ||
            !packedInput
          ) {
            throw new Error(
              "Bridge environment is missing"
            );
          }

          function decrypt(base64, secret) {
            const packed =
              Buffer.from(
                base64,
                "base64"
              );

            if (
              packed.length < 29
            ) {
              throw new Error(
                "Invalid encrypted payload"
              );
            }

            const iv =
              packed.subarray(
                0,
                12
              );

            const body =
              packed.subarray(12);

            const tag =
              body.subarray(
                body.length - 16
              );

            const ciphertext =
              body.subarray(
                0,
                body.length - 16
              );

            const key =
              createHash(
                "sha256"
              )
                .update(secret)
                .digest();

            const d =
              createDecipheriv(
                "aes-256-gcm",
                key,
                iv
              );

            d.setAuthTag(tag);

            return JSON.parse(
              Buffer.concat([
                d.update(ciphertext),
                d.final()
              ]).toString(
                "utf8"
              )
            );
          }

          async function api(
            method,
            body
          ) {
            const r =
              await fetch(
                `https://api.telegram.org/bot${token}/${method}`,
                {
                  method: "POST",
                  headers: {
                    "content-type":
                      "application/json"
                  },
                  body:
                    JSON.stringify(
                      body
                    )
                }
              );

            const j =
              await r.json();

            if (!j.ok) {
              throw new Error(
                j.description ||
                "Telegram API error"
              );
            }

            return j.result;
          }

          const send =
            (
              chatId,
              text
            ) =>
              api(
                "sendMessage",
                {
                  chat_id:
                    chatId,
                  text:
                    String(text)
                      .slice(
                        0,
                        3900
                      ),
                  disable_web_page_preview:
                    true
                }
              );

          async function photo(
            chatId,
            bytes,
            caption
          ) {
            const form =
              new FormData();

            form.append(
              "chat_id",
              String(chatId)
            );

            form.append(
              "caption",
              String(caption)
                .slice(
                  0,
                  900
                )
            );

            form.append(
              "photo",
              new Blob(
                [bytes],
                {
                  type:
                    "image/png"
                }
              ),
              "browser.png"
            );

            const r =
              await fetch(
                `https://api.telegram.org/bot${token}/sendPhoto`,
                {
                  method: "POST",
                  body: form
                }
              );

            const j =
              await r.json();

            if (!j.ok) {
              throw new Error(
                j.description ||
                "Telegram photo error"
              );
            }
          }

          function urlFrom(text) {
            const m =
              String(text)
                .match(
                  /https?:\/\/[^\s<>"']+/i
                );

            return m
              ? m[0].replace(
                  /[),.;]+$/,
                  ""
                )
              : null;
          }

          function blocked(
            hostname
          ) {
            const h =
              hostname
                .toLowerCase()
                .replace(
                  /^\[|\]$/g,
                  ""
                );

            if (
              h === "localhost" ||
              h === "::1" ||
              h.endsWith(
                ".local"
              )
            ) {
              return true;
            }

            const p =
              h.split(".")
                .map(Number);

            if (
              p.length === 4 &&
              p.every(
                (x) =>
                  Number.isInteger(x) &&
                  x >= 0 &&
                  x <= 255
              )
            ) {
              const [a, b] =
                p;

              return (
                a === 10 ||
                a === 127 ||
                (
                  a === 169 &&
                  b === 254
                ) ||
                (
                  a === 192 &&
                  b === 168
                ) ||
                (
                  a === 172 &&
                  b >= 16 &&
                  b <= 31
                )
              );
            }

            return /^(fc|fd|fe8|fe9|fea|feb)/.test(
              h
            );
          }

          function cleanUrl(raw) {
            const u =
              new URL(raw);

            if (
              ![
                "http:",
                "https:"
              ].includes(
                u.protocol
              ) ||
              blocked(
                u.hostname
              )
            ) {
              throw new Error(
                "Этот адрес нельзя открыть"
              );
            }

            return u.href;
          }

          const payload =
            decrypt(
              packedInput,
              token
            );

          const task =
            String(
              payload.task || ""
            ).trim();

          const chatId =
            String(
              payload.chat_id || ""
            );

          const bridgeUrl =
            String(
              payload.bridge_url || ""
            ).replace(
              /\/$/,
              ""
            );

          const expected =
            (
              await fs.readFile(
                ".state/owner.hash",
                "utf8"
              )
            ).trim();

          const actual =
            createHmac(
              "sha256",
              token
            )
              .update(chatId)
              .digest("hex");

          const a =
            Buffer.from(
              expected
            );

          const b =
            Buffer.from(
              actual
            );

          if (
            a.length !== b.length ||
            !timingSafeEqual(
              a,
              b
            )
          ) {
            console.log(
              "Unauthorized chat ignored"
            );

            process.exit(0);
          }

          const confirmed =
            /^\s*(ПОДТВЕРЖДАЮ|CONFIRM)\s*:/i
              .test(task);

          const agentKey =
            createHash(
              "sha256"
            )
              .update(
                `browser-ai:${token}`
              )
              .digest(
                "hex"
              );

          async function askAI(
            state,
            history
          ) {
            const r =
              await fetch(
                `${bridgeUrl}/ai`,
                {
                  method: "POST",
                  headers: {
                    "content-type":
                      "application/json",
                    "X-Agent-Key":
                      agentKey
                  },
                  body:
                    JSON.stringify(
                      {
                        task,
                        state: {
                          ...state,
                          confirmed
                        },
                        history:
                          history.slice(
                            -8
                          )
                      }
                    )
                }
              );

            const j =
              await r.json()
                .catch(
                  () => null
                );

            if (
              !r.ok ||
              !j?.ok ||
              !j?.decision
            ) {
              throw new Error(
                j?.error ||
                `AI bridge error ${r.status}`
              );
            }

            return j.decision;
          }

          async function snapshot(
            page
          ) {
            return page.evaluate(
              () => {
                document
                  .querySelectorAll(
                    "[data-agent-id]"
                  )
                  .forEach(
                    (el) =>
                      el.removeAttribute(
                        "data-agent-id"
                      )
                  );

                const visible =
                  (el) => {
                    const s =
                      getComputedStyle(
                        el
                      );

                    const r =
                      el.getBoundingClientRect();

                    return (
                      s.visibility !==
                        "hidden" &&
                      s.display !==
                        "none" &&
                      r.width > 1 &&
                      r.height > 1
                    );
                  };

                const selectors =
                  [
                    "a",
                    "button",
                    "input",
                    "textarea",
                    "select",
                    "[role='button']",
                    "[role='link']",
                    "[contenteditable='true']"
                  ].join(",");

                const elements =
                  [];

                let id = 1;

                for (
                  const el of
                  document.querySelectorAll(
                    selectors
                  )
                ) {
                  if (
                    !visible(el)
                  ) {
                    continue;
                  }

                  if (
                    elements.length >=
                    70
                  ) {
                    break;
                  }

                  const tag =
                    el.tagName
                      .toLowerCase();

                  const type =
                    (
                      el.getAttribute(
                        "type"
                      ) || ""
                    ).slice(
                      0,
                      40
                    );

                  const aria =
                    (
                      el.getAttribute(
                        "aria-label"
                      ) || ""
                    )
                      .trim()
                      .slice(
                        0,
                        180
                      );

                  const placeholder =
                    (
                      el.getAttribute(
                        "placeholder"
                      ) || ""
                    )
                      .trim()
                      .slice(
                        0,
                        180
                      );

                  const value =
                    (
                      "value" in el
                        ? String(
                            el.value ||
                            ""
                          )
                        : ""
                    ).slice(
                      0,
                      180
                    );

                  let text =
                    (
                      el.innerText ||
                      el.textContent ||
                      ""
                    )
                      .replace(
                        /\s+/g,
                        " "
                      )
                      .trim()
                      .slice(
                        0,
                        220
                      );

                  if (
                    tag === "select"
                  ) {
                    const opts =
                      [
                        ...el.options
                      ]
                        .slice(
                          0,
                          12
                        )
                        .map(
                          (o) =>
                            o.text.trim()
                        )
                        .filter(
                          Boolean
                        )
                        .join(
                          " | "
                        );

                    text =
                      `${text} ${opts}`
                        .trim()
                        .slice(
                          0,
                          220
                        );
                  }

                  const href =
                    tag === "a"
                      ? String(
                          el.href || ""
                        ).slice(
                          0,
                          300
                        )
                      : "";

                  const agentId =
                    String(id++);

                  el.setAttribute(
                    "data-agent-id",
                    agentId
                  );

                  elements.push({
                    id:
                      agentId,
                    tag,
                    type,
                    text,
                    aria,
                    placeholder,
                    value,
                    href
                  });
                }

                return {
                  url:
                    location.href,
                  title:
                    document.title ||
                    "",
                  text:
                    (
                      document.body
                        ?.innerText ||
                      ""
                    )
                      .replace(
                        /\s+/g,
                        " "
                      )
                      .trim()
                      .slice(
                        0,
                        6500
                      ),
                  elements
                };
              }
            );
          }

          function sensitiveMeta(
            meta = {}
          ) {
            const s =
              `${meta.text || ""} ` +
              `${meta.aria || ""} ` +
              `${meta.value || ""} ` +
              `${meta.placeholder || ""}`;

            return /(оплат|купить|заказ|отправ|подтверд|удал|опубли|размест|оформ|подпис|изменить пароль|войти|pay|buy|purchase|place order|submit|send|confirm|delete|publish|post|sign|log in|sign in)/i
              .test(s);
          }

          async function locate(
            page,
            id
          ) {
            if (!id) {
              throw new Error(
                "AI не указал target_id"
              );
            }

            const safeId =
              String(id)
                .replace(
                  /"/g,
                  ""
                );

            const loc =
              page
                .locator(
                  `[data-agent-id="${safeId}"]`
                )
                .first();

            if (
              await loc.count() ===
              0
            ) {
              throw new Error(
                `Элемент ${id} не найден`
              );
            }

            return loc;
          }

          async function safeShot(
            page
          ) {
            return page
              .screenshot({
                type: "png",
                fullPage: false
              })
              .catch(
                () => null
              );
          }

          async function directMode(
            page,
            mode,
            raw
          ) {
            const target =
              cleanUrl(raw);

            await page.goto(
              target,
              {
                waitUntil:
                  "domcontentloaded",
                timeout:
                  45000
              }
            );

            await page.waitForTimeout(
              1200
            );

            const title =
              (
                await page.title()
              ).trim() ||
              "Без заголовка";

            const currentUrl =
              page.url();

            const body =
              await page
                .locator(
                  "body"
                )
                .innerText()
                .catch(
                  () => ""
                );

            const clean =
              body
                .replace(
                  /\s+/g,
                  " "
                )
                .trim()
                .slice(
                  0,
                  3200
                );

            if (
              mode === "text"
            ) {
              await send(
                chatId,
                `✅ ${title}\n${currentUrl}\n\n${clean || "Текст страницы не найден."}`
              );
            } else {
              await send(
                chatId,
                `✅ Страница открыта\n\n${title}\n${currentUrl}`
              );

              const shot =
                await safeShot(
                  page
                );

              if (shot) {
                await photo(
                  chatId,
                  shot,
                  `${title}\n${currentUrl}`
                );
              }
            }
          }

          let browser;

          try {
            browser =
              await chromium.launch({
                headless:
                  true
              });

            const context =
              await browser
                .newContext({
                  viewport: {
                    width:
                      1280,
                    height:
                      900
                  }
                });

            const page =
              await context
                .newPage();

            page.on(
              "dialog",
              (d) =>
                d.dismiss()
                  .catch(
                    () => {}
                  )
            );

            const raw =
              urlFrom(task);

            const isCommand =
              /^\/(shot|text|open)\b/i
                .test(task);

            if (isCommand) {
              if (!raw) {
                await send(
                  chatId,
                  "❌ Для этой команды нужна ссылка."
                );

                process.exit(0);
              }

              const mode =
                task.startsWith(
                  "/text"
                )
                  ? "text"
                  : task.startsWith(
                      "/shot"
                    )
                    ? "shot"
                    : "open";

              await directMode(
                page,
                mode,
                raw
              );

              process.exit(0);
            }

            if (raw) {
              await page.goto(
                cleanUrl(raw),
                {
                  waitUntil:
                    "domcontentloaded",
                  timeout:
                    45000
                }
              );
            } else {
              const q =
                encodeURIComponent(
                  task.replace(
                    /^\s*(ПОДТВЕРЖДАЮ|CONFIRM)\s*:\s*/i,
                    ""
                  )
                );

              await page.goto(
                `https://www.bing.com/search?q=${q}`,
                {
                  waitUntil:
                    "domcontentloaded",
                  timeout:
                    45000
                }
              );
            }

            await page.waitForTimeout(
              1000
            );

            const history =
              [];

            for (
              let step = 1;
              step <= 12;
              step++
            ) {
              const state =
                await snapshot(
                  page
                );

              const decision =
                await askAI(
                  state,
                  history
                );

              const action =
                String(
                  decision.action ||
                  ""
                );

              const targetId =
                String(
                  decision.target_id ||
                  ""
                );

              const value =
                String(
                  decision.value ||
                  ""
                );

              const answer =
                String(
                  decision.answer ||
                  ""
                ).trim();

              if (
                action ===
                "finish"
              ) {
                const finalText =
                  answer ||
                  state.text
                    .slice(
                      0,
                      1800
                    ) ||
                  "Задача выполнена.";

                await send(
                  chatId,
                  `🤖 ${finalText}\n\n${state.title}\n${state.url}`
                );

                const shot =
                  await safeShot(
                    page
                  );

                if (shot) {
                  await photo(
                    chatId,
                    shot,
                    `${state.title}\n${state.url}`
                  );
                }

                process.exit(0);
              }

              if (
                action ===
                "ask_confirmation"
              ) {
                await send(
                  chatId,
                  "⚠️ Нужно ваше подтверждение перед следующим действием.\n\n" +
                  `${answer || value || "Действие может иметь последствия."}\n\n` +
                  "Если разрешаете, отправьте новую команду, начиная с:\n" +
                  "ПОДТВЕРЖДАЮ: ..."
                );

                const shot =
                  await safeShot(
                    page
                  );

                if (shot) {
                  await photo(
                    chatId,
                    shot,
                    `Ожидаю подтверждение\n${state.url}`
                  );
                }

                process.exit(0);
              }

              try {
                if (
                  action ===
                  "click"
                ) {
                  const meta =
                    state.elements
                      .find(
                        (x) =>
                          String(
                            x.id
                          ) ===
                          targetId
                      ) ||
                    {};

                  if (
                    !confirmed &&
                    sensitiveMeta(
                      meta
                    )
                  ) {
                    await send(
                      chatId,
                      `⚠️ Остановился перед действием «${meta.text || meta.aria || "подтвердить действие"}».\n\n` +
                      "Если разрешаете, отправьте:\n" +
                      `ПОДТВЕРЖДАЮ: ${task}`
                    );

                    process.exit(0);
                  }

                  const loc =
                    await locate(
                      page,
                      targetId
                    );

                  await loc.click({
                    timeout:
                      12000
                  });

                  await page
                    .waitForLoadState(
                      "domcontentloaded",
                      {
                        timeout:
                          10000
                      }
                    )
                    .catch(
                      () => {}
                    );

                  await page
                    .waitForTimeout(
                      700
                    );

                  history.push(
                    `step ${step}: click #${targetId} ${meta.text || meta.aria || ""}`
                  );
                } else if (
                  action ===
                  "type"
                ) {
                  const loc =
                    await locate(
                      page,
                      targetId
                    );

                  await loc
                    .fill(value)
                    .catch(
                      async () => {
                        await loc.click();

                        await page
                          .keyboard
                          .press(
                            "Control+A"
                          )
                          .catch(
                            () => {}
                          );

                        await page
                          .keyboard
                          .type(
                            value,
                            {
                              delay:
                                10
                            }
                          );
                      }
                    );

                  history.push(
                    `step ${step}: type #${targetId} ${value.slice(0, 120)}`
                  );
                } else if (
                  action ===
                  "press"
                ) {
                  const loc =
                    await locate(
                      page,
                      targetId
                    );

                  await loc.press(
                    value ||
                    "Enter"
                  );

                  await page
                    .waitForLoadState(
                      "domcontentloaded",
                      {
                        timeout:
                          10000
                      }
                    )
                    .catch(
                      () => {}
                    );

                  await page
                    .waitForTimeout(
                      700
                    );

                  history.push(
                    `step ${step}: press #${targetId} ${value || "Enter"}`
                  );
                } else if (
                  action ===
                  "select"
                ) {
                  const loc =
                    await locate(
                      page,
                      targetId
                    );

                  await loc
                    .selectOption({
                      label:
                        value
                    })
                    .catch(
                      () =>
                        loc.selectOption(
                          value
                        )
                    );

                  await page
                    .waitForTimeout(
                      500
                    );

                  history.push(
                    `step ${step}: select #${targetId} ${value}`
                  );
                } else if (
                  action ===
                  "scroll"
                ) {
                  const dir =
                    /up|вверх/i
                      .test(
                        value
                      )
                      ? -750
                      : 750;

                  await page
                    .mouse
                    .wheel(
                      0,
                      dir
                    );

                  await page
                    .waitForTimeout(
                      600
                    );

                  history.push(
                    `step ${step}: scroll ${dir < 0 ? "up" : "down"}`
                  );
                } else if (
                  action ===
                  "goto"
                ) {
                  await page.goto(
                    cleanUrl(
                      value
                    ),
                    {
                      waitUntil:
                        "domcontentloaded",
                      timeout:
                        45000
                    }
                  );

                  await page
                    .waitForTimeout(
                      700
                    );

                  history.push(
                    `step ${step}: goto ${value}`
                  );
                } else if (
                  action ===
                  "back"
                ) {
                  await page
                    .goBack({
                      waitUntil:
                        "domcontentloaded",
                      timeout:
                        15000
                    })
                    .catch(
                      () => {}
                    );

                  await page
                    .waitForTimeout(
                      600
                    );

                  history.push(
                    `step ${step}: back`
                  );
                } else if (
                  action ===
                  "wait"
                ) {
                  await page
                    .waitForTimeout(
                      1800
                    );

                  history.push(
                    `step ${step}: wait`
                  );
                } else {
                  history.push(
                    `step ${step}: invalid action ${action}`
                  );
                }
              } catch (e) {
                history.push(
                  `step ${step}: ${action} failed: ${String(e?.message || e).slice(0, 220)}`
                );
              }
            }

            const state =
              await snapshot(
                page
              );

            await send(
              chatId,
              "⚠️ Агент сделал 12 шагов и остановился, чтобы не расходовать лимит бесконечно.\n\n" +
              `Текущая страница: ${state.title}\n${state.url}`
            );

            const shot =
              await safeShot(
                page
              );

            if (shot) {
              await photo(
                chatId,
                shot,
                `${state.title}\n${state.url}`
              );
            }
          } catch (e) {
            await send(
              chatId,
              "❌ Браузер не смог выполнить задачу.\n\n" +
              String(
                e?.message || e
              ).slice(
                0,
                1600
              )
            ).catch(
              () => {}
            );

            throw e;
          } finally {
            if (browser) {
              await browser
                .close()
                .catch(
                  () => {}
                );
            }
          }
          EOF

      - name: Save generated source
        shell: bash
        run: |
          set -euo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            worker/src/index.js \
            wrangler.jsonc \
            src/execute-dispatch.js

          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit \
              -m "Add AI browser agent [skip ci]"

            git push
          fi

      - name: Deploy Cloudflare Worker with AI
        run: |
          npx --yes wrangler@4.147.0 deploy \
            --config wrangler.jsonc

      - name: Configure Worker secrets
        shell: bash
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail

          OWNER_HASH="$(
            cat .state/owner.hash
          )"

          WEBHOOK_SECRET="$(
            openssl rand -hex 32
          )"

          echo "::add-mask::$WEBHOOK_SECRET"

          printf '%s' "$GH_PAT" |
            npx --yes wrangler@4.147.0 secret put \
              GH_PAT \
              --config wrangler.jsonc

          printf '%s' "$TELEGRAM_BOT_TOKEN" |
            npx --yes wrangler@4.147.0 secret put \
              TELEGRAM_BOT_TOKEN \
              --config wrangler.jsonc

          printf '%s' "$OWNER_HASH" |
            npx --yes wrangler@4.147.0 secret put \
              OWNER_HASH \
              --config wrangler.jsonc

          printf '%s' "$WEBHOOK_SECRET" |
            npx --yes wrangler@4.147.0 secret put \
              WEBHOOK_SECRET \
              --config wrangler.jsonc

          printf '%s' "$GITHUB_REPOSITORY" |
            npx --yes wrangler@4.147.0 secret put \
              GITHUB_REPO \
              --config wrangler.jsonc

          echo \
            "WEBHOOK_SECRET=$WEBHOOK_SECRET" \
            >> "$GITHUB_ENV"

      - name: Resolve Worker URL
        shell: bash
        run: |
          set -euo pipefail

          R="$(
            curl -fsS \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain"
          )"

          SUB="$(
            printf '%s' "$R" |
              jq -r \
                '.result.subdomain // empty'
          )"

          if [ -z "$SUB" ]; then
            echo "workers.dev subdomain not found."

            printf '%s' "$R" |
              jq \
                '{success,errors}'

            exit 1
          fi

          echo \
            "WORKER_URL=https://nikitin-browser-bridge.${SUB}.workers.dev" \
            >> "$GITHUB_ENV"

      - name: Configure Telegram webhook
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail

          P="$(
            jq -n \
              --arg url \
                "${WORKER_URL}/telegram" \
              --arg secret \
                "$WEBHOOK_SECRET" \
              '{
                url:$url,
                secret_token:$secret,
                allowed_updates:["message"],
                drop_pending_updates:false
              }'
          )"

          R="$(
            curl -sS \
              -X POST \
              -H "Content-Type: application/json" \
              -d "$P" \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook"
          )"

          printf '%s' "$R" |
            jq -e \
              '.ok == true' \
              >/dev/null || {
                echo "Telegram setWebhook failed."

                printf '%s' "$R" |
                  jq \
                    '{ok,description}'

                exit 1
              }

          curl -fsS \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getWebhookInfo" |
            jq \
              '{
                ok,
                url:.result.url,
                pending_update_count:.result.pending_update_count,
                last_error_message:.result.last_error_message
              }'

      - name: Verify bridge
        shell: bash
        run: |
          set -euo pipefail

          R="$(
            curl -fsS \
              "${WORKER_URL}/health"
          )"

          printf '%s' "$R" |
            jq -e \
              '.ok == true and .ai == true' \
              >/dev/null

          echo \
            "Bridge + AI binding OK: ${WORKER_URL}"

      - name: Verify Workers AI
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail

          AI_KEY="$(
            printf 'browser-ai:%s' "$TELEGRAM_BOT_TOKEN" |
              sha256sum |
              awk '{print $1}'
          )"

          echo "::add-mask::$AI_KEY"

          BODY='{
            "task":"Для теста сразу заверши задачу и ответь OK.",
            "state":{
              "url":"https://example.com/",
              "title":"Test",
              "text":"Test page",
              "elements":[],
              "confirmed":false
            },
            "history":[]
          }'

          R="$(
            curl -fsS \
              -X POST \
              -H "Content-Type: application/json" \
              -H "X-Agent-Key: ${AI_KEY}" \
              -d "$BODY" \
              "${WORKER_URL}/ai"
          )"

          printf '%s' "$R" |
            jq -e \
              '.ok == true and .decision.action != null' \
              >/dev/null

          echo \
            "Workers AI OK"

  browser:
    if: github.event_name == 'workflow_dispatch' && inputs.payload != ''
    runs-on: ubuntu-latest
    timeout-minutes: 12

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: |
          npm ci

      - name: Install Chromium
        run: |
          npx playwright install \
            --with-deps chromium

      - name: Execute browser agent
        env:
          BRIDGE_PAYLOAD: ${{ inputs.payload }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          node src/execute-dispatch.js
