name: Nikitin Browser Agent

on:
  push:
    branches: [main]
    paths: [".github/workflows/bootstrap.yml"]

  workflow_dispatch:
    inputs:
      payload:
        description: "Encrypted Telegram task"
        required: false
        type: string

permissions:
  contents: write

jobs:
  deploy:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.payload == '')
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail

          R="$(curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            https://api.cloudflare.com/client/v4/accounts)"

          ID="$(printf '%s' "$R" | jq -r '.result[0].id // empty')"

          if [ -z "$ID" ]; then
            echo "Cloudflare account ID not found."
            printf '%s' "$R" | jq '{success,errors,result_info}'
            exit 1
          fi

          echo "CLOUDFLARE_ACCOUNT_ID=$ID" >> "$GITHUB_ENV"

      - name: Generate bridge files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p worker/src src

          cat > wrangler.jsonc <<'EOF'
          {
            "$schema": "node_modules/wrangler/config-schema.json",
            "name": "nikitin-browser-bridge",
            "main": "worker/src/index.js",
            "compatibility_date": "2026-10-05",
            "workers_dev": true
          }
          EOF

          cat > worker/src/index.js <<'EOF'
          const te = new TextEncoder();

          const reply = (data, status = 200) =>
            new Response(JSON.stringify(data), {
              status,
              headers: {
                "content-type": "application/json; charset=utf-8"
              }
            });

          function same(a = "", b = "") {
            if (a.length !== b.length) return false;

            let x = 0;

            for (let i = 0; i < a.length; i++) {
              x |= a.charCodeAt(i) ^ b.charCodeAt(i);
            }

            return x === 0;
          }

          async function hmac(secret, value) {
            const key = await crypto.subtle.importKey(
              "raw",
              te.encode(secret),
              {
                name: "HMAC",
                hash: "SHA-256"
              },
              false,
              ["sign"]
            );

            const sig = new Uint8Array(
              await crypto.subtle.sign(
                "HMAC",
                key,
                te.encode(String(value))
              )
            );

            return [...sig]
              .map((x) => x.toString(16).padStart(2, "0"))
              .join("");
          }

          function b64(bytes) {
            let s = "";

            for (const x of bytes) {
              s += String.fromCharCode(x);
            }

            return btoa(s);
          }

          async function encrypt(value, secret) {
            const raw = await crypto.subtle.digest(
              "SHA-256",
              te.encode(secret)
            );

            const key = await crypto.subtle.importKey(
              "raw",
              raw,
              "AES-GCM",
              false,
              ["encrypt"]
            );

            const iv = crypto.getRandomValues(
              new Uint8Array(12)
            );

            const ct = new Uint8Array(
              await crypto.subtle.encrypt(
                {
                  name: "AES-GCM",
                  iv
                },
                key,
                te.encode(JSON.stringify(value))
              )
            );

            const packed = new Uint8Array(
              iv.length + ct.length
            );

            packed.set(iv);
            packed.set(ct, iv.length);

            return b64(packed);
          }

          async function tg(env, chatId, text) {
            const r = await fetch(
              `https://api.telegram.org/bot${env.TELEGRAM_BOT_TOKEN}/sendMessage`,
              {
                method: "POST",
                headers: {
                  "content-type": "application/json"
                },
                body: JSON.stringify({
                  chat_id: chatId,
                  text,
                  disable_web_page_preview: true
                })
              }
            );

            const j = await r.json();

            if (!j.ok) {
              throw new Error(
                j.description || "Telegram API error"
              );
            }
          }

          async function dispatch(env, payload) {
            const r = await fetch(
              `https://api.github.com/repos/${env.GITHUB_REPO}/actions/workflows/bootstrap.yml/dispatches`,
              {
                method: "POST",
                headers: {
                  accept: "application/vnd.github+json",
                  authorization: `Bearer ${env.GH_PAT}`,
                  "content-type": "application/json",
                  "user-agent": "nikitin-browser-bridge",
                  "x-github-api-version": "2022-11-28"
                },
                body: JSON.stringify({
                  ref: "main",
                  inputs: {
                    payload
                  }
                })
              }
            );

            if (!r.ok) {
              throw new Error(
                `GitHub dispatch failed: ${r.status}`
              );
            }
          }

          export default {
            async fetch(request, env) {
              const u = new URL(request.url);

              if (
                request.method === "GET" &&
                u.pathname === "/health"
              ) {
                return reply({
                  ok: true,
                  service: "nikitin-browser-bridge"
                });
              }

              if (
                request.method !== "POST" ||
                u.pathname !== "/telegram"
              ) {
                return reply(
                  {
                    ok: false,
                    error: "not_found"
                  },
                  404
                );
              }

              const secret =
                request.headers.get(
                  "X-Telegram-Bot-Api-Secret-Token"
                ) || "";

              if (
                !env.WEBHOOK_SECRET ||
                !same(
                  secret,
                  env.WEBHOOK_SECRET
                )
              ) {
                return reply(
                  {
                    ok: false,
                    error: "forbidden"
                  },
                  403
                );
              }

              let update;

              try {
                update = await request.json();
              } catch {
                return reply(
                  {
                    ok: false,
                    error: "invalid_json"
                  },
                  400
                );
              }

              const chatId =
                update?.message?.chat?.id;

              const text =
                String(
                  update?.message?.text || ""
                ).trim();

              if (!chatId || !text) {
                return reply({
                  ok: true,
                  ignored: true
                });
              }

              const owner =
                await hmac(
                  env.TELEGRAM_BOT_TOKEN,
                  chatId
                );

              if (
                !env.OWNER_HASH ||
                !same(
                  owner,
                  env.OWNER_HASH
                )
              ) {
                return reply({
                  ok: true,
                  ignored: true
                });
              }

              if (
                text.startsWith("/start") ||
                text.startsWith("/help")
              ) {
                await tg(
                  env,
                  chatId,
                  "✅ Nikitin Browser Agent работает мгновенно.\n\n" +
                  "/shot URL — скриншот\n" +
                  "/open URL — открыть страницу\n" +
                  "/text URL — текст страницы\n\n" +
                  "Следующий этап — AI-команды обычным языком."
                );

                return reply({
                  ok: true,
                  handled: "help"
                });
              }

              const payload =
                await encrypt(
                  {
                    task: text,
                    chat_id: String(chatId),
                    update_id: String(
                      update?.update_id ?? ""
                    )
                  },
                  env.TELEGRAM_BOT_TOKEN
                );

              try {
                await dispatch(
                  env,
                  payload
                );

                await tg(
                  env,
                  chatId,
                  "⏳ Принял. Запускаю облачный браузер…"
                );

                return reply({
                  ok: true,
                  dispatched: true
                });
              } catch (e) {
                await tg(
                  env,
                  chatId,
                  "❌ Не удалось запустить браузерную задачу."
                );

                return reply(
                  {
                    ok: false,
                    error: String(
                      e?.message || e
                    )
                  },
                  502
                );
              }
            }
          };
          EOF

          cat > src/execute-dispatch.js <<'EOF'
          import {
            createDecipheriv,
            createHash,
            createHmac,
            timingSafeEqual
          } from "node:crypto";

          import fs from "node:fs/promises";
          import { chromium } from "playwright";

          const token =
            process.env.TELEGRAM_BOT_TOKEN;

          const packedInput =
            process.env.BRIDGE_PAYLOAD;

          if (!token || !packedInput) {
            throw new Error(
              "Bridge environment is missing"
            );
          }

          function decrypt(base64, secret) {
            const packed =
              Buffer.from(
                base64,
                "base64"
              );

            if (packed.length < 29) {
              throw new Error(
                "Invalid encrypted payload"
              );
            }

            const iv =
              packed.subarray(
                0,
                12
              );

            const body =
              packed.subarray(12);

            const tag =
              body.subarray(
                body.length - 16
              );

            const ciphertext =
              body.subarray(
                0,
                body.length - 16
              );

            const key =
              createHash("sha256")
                .update(secret)
                .digest();

            const d =
              createDecipheriv(
                "aes-256-gcm",
                key,
                iv
              );

            d.setAuthTag(tag);

            return JSON.parse(
              Buffer.concat([
                d.update(ciphertext),
                d.final()
              ]).toString("utf8")
            );
          }

          async function api(
            method,
            body
          ) {
            const r =
              await fetch(
                `https://api.telegram.org/bot${token}/${method}`,
                {
                  method: "POST",
                  headers: {
                    "content-type":
                      "application/json"
                  },
                  body:
                    JSON.stringify(body)
                }
              );

            const j =
              await r.json();

            if (!j.ok) {
              throw new Error(
                j.description ||
                "Telegram API error"
              );
            }

            return j.result;
          }

          const send =
            (chatId, text) =>
              api(
                "sendMessage",
                {
                  chat_id: chatId,
                  text:
                    text.slice(
                      0,
                      3900
                    ),
                  disable_web_page_preview:
                    true
                }
              );

          async function photo(
            chatId,
            bytes,
            caption
          ) {
            const form =
              new FormData();

            form.append(
              "chat_id",
              String(chatId)
            );

            form.append(
              "caption",
              caption.slice(
                0,
                900
              )
            );

            form.append(
              "photo",
              new Blob(
                [bytes],
                {
                  type: "image/png"
                }
              ),
              "browser.png"
            );

            const r =
              await fetch(
                `https://api.telegram.org/bot${token}/sendPhoto`,
                {
                  method: "POST",
                  body: form
                }
              );

            const j =
              await r.json();

            if (!j.ok) {
              throw new Error(
                j.description ||
                "Telegram photo error"
              );
            }
          }

          function urlFrom(text) {
            const m =
              String(text).match(
                /https?:\/\/[^\s<>"']+/i
              );

            return m
              ? m[0].replace(
                  /[),.;]+$/,
                  ""
                )
              : null;
          }

          function blocked(hostname) {
            const h =
              hostname
                .toLowerCase()
                .replace(
                  /^\[|\]$/g,
                  ""
                );

            if (
              h === "localhost" ||
              h === "::1" ||
              h.endsWith(".local")
            ) {
              return true;
            }

            const p =
              h.split(".")
                .map(Number);

            if (
              p.length === 4 &&
              p.every(
                (x) =>
                  Number.isInteger(x) &&
                  x >= 0 &&
                  x <= 255
              )
            ) {
              const [a, b] = p;

              return (
                a === 10 ||
                a === 127 ||
                (
                  a === 169 &&
                  b === 254
                ) ||
                (
                  a === 192 &&
                  b === 168
                ) ||
                (
                  a === 172 &&
                  b >= 16 &&
                  b <= 31
                )
              );
            }

            return /^(fc|fd|fe8|fe9|fea|feb)/.test(
              h
            );
          }

          const payload =
            decrypt(
              packedInput,
              token
            );

          const task =
            String(
              payload.task || ""
            ).trim();

          const chatId =
            String(
              payload.chat_id || ""
            );

          const expected =
            (
              await fs.readFile(
                ".state/owner.hash",
                "utf8"
              )
            ).trim();

          const actual =
            createHmac(
              "sha256",
              token
            )
              .update(chatId)
              .digest("hex");

          const a =
            Buffer.from(expected);

          const b =
            Buffer.from(actual);

          if (
            a.length !== b.length ||
            !timingSafeEqual(
              a,
              b
            )
          ) {
            console.log(
              "Unauthorized chat ignored"
            );

            process.exit(0);
          }

          const raw =
            urlFrom(task);

          if (!raw) {
            await send(
              chatId,
              "🤖 Мгновенный мост уже работает.\n\n" +
              "Сейчас нужна ссылка, например:\n" +
              "/shot https://example.com\n\n" +
              "Дальше подключим AI для обычных команд."
            );

            process.exit(0);
          }

          let target;

          try {
            target =
              new URL(raw);
          } catch {
            await send(
              chatId,
              "❌ Некорректная ссылка."
            );

            process.exit(0);
          }

          if (
            ![
              "http:",
              "https:"
            ].includes(
              target.protocol
            ) ||
            blocked(
              target.hostname
            )
          ) {
            await send(
              chatId,
              "❌ Этот адрес нельзя открыть."
            );

            process.exit(0);
          }

          const mode =
            task.startsWith("/text")
              ? "text"
              : task.startsWith("/shot")
                ? "shot"
                : "open";

          let browser;

          try {
            browser =
              await chromium.launch({
                headless: true
              });

            const context =
              await browser.newContext({
                viewport: {
                  width: 1280,
                  height: 900
                }
              });

            const page =
              await context.newPage();

            await page.goto(
              target.href,
              {
                waitUntil:
                  "domcontentloaded",
                timeout: 45000
              }
            );

            await page.waitForTimeout(
              1200
            );

            const title =
              (
                await page.title()
              ).trim() ||
              "Без заголовка";

            const currentUrl =
              page.url();

            const body =
              await page
                .locator("body")
                .innerText()
                .catch(
                  () => ""
                );

            const clean =
              body
                .replace(
                  /\s+/g,
                  " "
                )
                .trim()
                .slice(
                  0,
                  3200
                );

            if (
              mode === "text"
            ) {
              await send(
                chatId,
                `✅ ${title}\n${currentUrl}\n\n${clean || "Текст страницы не найден."}`
              );
            } else {
              const shot =
                await page.screenshot({
                  type: "png",
                  fullPage: false
                });

              await send(
                chatId,
                `✅ Страница открыта\n\n${title}\n${currentUrl}`
              );

              await photo(
                chatId,
                shot,
                `${title}\n${currentUrl}`
              );
            }
          } catch (e) {
            await send(
              chatId,
              "❌ Браузер не смог выполнить задачу.\n\n" +
              String(
                e?.message || e
              ).slice(
                0,
                1400
              )
            );
          } finally {
            if (browser) {
              await browser.close()
                .catch(
                  () => {}
                );
            }
          }
          EOF

      - name: Save generated source
        shell: bash
        run: |
          set -euo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            worker/src/index.js \
            wrangler.jsonc \
            src/execute-dispatch.js

          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit \
              -m "Add instant Telegram browser bridge [skip ci]"

            git push
          fi

      - name: Deploy Cloudflare Worker
        run: |
          npx --yes wrangler@latest deploy \
            --config wrangler.jsonc

      - name: Configure Worker secrets
        shell: bash
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail

          OWNER_HASH="$(
            cat .state/owner.hash
          )"

          WEBHOOK_SECRET="$(
            openssl rand -hex 32
          )"

          echo "::add-mask::$WEBHOOK_SECRET"

          printf '%s' "$GH_PAT" |
            npx --yes wrangler@latest secret put \
              GH_PAT \
              --config wrangler.jsonc

          printf '%s' "$TELEGRAM_BOT_TOKEN" |
            npx --yes wrangler@latest secret put \
              TELEGRAM_BOT_TOKEN \
              --config wrangler.jsonc

          printf '%s' "$OWNER_HASH" |
            npx --yes wrangler@latest secret put \
              OWNER_HASH \
              --config wrangler.jsonc

          printf '%s' "$WEBHOOK_SECRET" |
            npx --yes wrangler@latest secret put \
              WEBHOOK_SECRET \
              --config wrangler.jsonc

          printf '%s' "$GITHUB_REPOSITORY" |
            npx --yes wrangler@latest secret put \
              GITHUB_REPO \
              --config wrangler.jsonc

          echo \
            "WEBHOOK_SECRET=$WEBHOOK_SECRET" \
            >> "$GITHUB_ENV"

      - name: Resolve Worker URL
        shell: bash
        run: |
          set -euo pipefail

          R="$(
            curl -fsS \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain"
          )"

          SUB="$(
            printf '%s' "$R" |
              jq -r \
                '.result.subdomain // empty'
          )"

          if [ -z "$SUB" ]; then
            echo \
              "workers.dev subdomain not found."

            printf '%s' "$R" |
              jq \
                '{success,errors}'

            exit 1
          fi

          echo \
            "WORKER_URL=https://nikitin-browser-bridge.${SUB}.workers.dev" \
            >> "$GITHUB_ENV"

      - name: Configure Telegram webhook
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail

          P="$(
            jq -n \
              --arg url \
                "${WORKER_URL}/telegram" \
              --arg secret \
                "$WEBHOOK_SECRET" \
              '{
                url:$url,
                secret_token:$secret,
                allowed_updates:["message"],
                drop_pending_updates:false
              }'
          )"

          R="$(
            curl -sS \
              -X POST \
              -H "Content-Type: application/json" \
              -d "$P" \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook"
          )"

          printf '%s' "$R" |
            jq -e \
              '.ok == true' \
              >/dev/null || {
                echo \
                  "Telegram setWebhook failed."

                printf '%s' "$R" |
                  jq \
                    '{ok,description}'

                exit 1
              }

          curl -fsS \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getWebhookInfo" |
            jq \
              '{
                ok,
                url:.result.url,
                pending_update_count:.result.pending_update_count,
                last_error_message:.result.last_error_message
              }'

      - name: Verify bridge
        shell: bash
        run: |
          set -euo pipefail

          for n in 1 2 3 4 5; do
            if \
              curl -fsS \
                "${WORKER_URL}/health" |
              jq -e \
                '.ok == true' \
                >/dev/null
            then
              echo \
                "Bridge OK: ${WORKER_URL}/health"

              exit 0
            fi

            sleep 3
          done

          exit 1

  browser:
    if: github.event_name == 'workflow_dispatch' && inputs.payload != ''
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: |
          npx playwright install \
            --with-deps chromium

      - name: Execute Telegram browser task
        env:
          BRIDGE_PAYLOAD: ${{ inputs.payload }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          node src/execute-dispatch.js
