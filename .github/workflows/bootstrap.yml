name: Nikitin Browser Agent

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap.yml"

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: nikitin-browser-agent
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate agent files
        if: github.event_name != 'schedule'
        shell: bash
        run: |
          mkdir -p src .state

          cat > package.json <<'EOF'
          {
            "name": "nikitin-browser-agent",
            "version": "2.0.0",
            "private": true,
            "type": "module",
            "scripts": {
              "poll": "node src/telegram-poll.js",
              "agent": "node src/execute-task.js",
              "test:browser": "node src/test-browser.js"
            },
            "dependencies": {
              "playwright": "1.55.0"
            }
          }
          EOF

          cat > src/telegram-poll.js <<'EOF'
          import fs from "node:fs/promises";
          import crypto from "node:crypto";

          const token = process.env.TELEGRAM_BOT_TOKEN;

          if (!token) {
            throw new Error("TELEGRAM_BOT_TOKEN is missing");
          }

          const stateDir = ".state";
          const ownerFile = `${stateDir}/owner.hash`;
          const offsetFile = `${stateDir}/telegram.offset`;
          const pendingFile = `${stateDir}/pending.json`;

          await fs.mkdir(stateDir, { recursive: true });

          function ownerHash(chatId) {
            return crypto
              .createHmac("sha256", token)
              .update(String(chatId))
              .digest("hex");
          }

          async function readFile(path, fallback = "") {
            try {
              return (await fs.readFile(path, "utf8")).trim();
            } catch {
              return fallback;
            }
          }

          async function telegram(method, body = {}) {
            const response = await fetch(
              `https://api.telegram.org/bot${token}/${method}`,
              {
                method: "POST",
                headers: {
                  "content-type": "application/json"
                },
                body: JSON.stringify(body)
              }
            );

            const data = await response.json();

            if (!data.ok) {
              throw new Error(
                `Telegram API error: ${data.description || "unknown"}`
              );
            }

            return data.result;
          }

          async function send(chatId, text) {
            await telegram("sendMessage", {
              chat_id: chatId,
              text,
              disable_web_page_preview: true
            });
          }

          const offsetRaw = await readFile(offsetFile, "0");
          const offset = Number(offsetRaw) || 0;

          let owner = await readFile(ownerFile);

          const updates = await telegram("getUpdates", {
            offset,
            timeout: 0,
            allowed_updates: ["message"]
          });

          let nextOffset = offset;
          let pending = false;

          for (const update of updates) {
            const message = update.message;

            if (!message?.chat?.id) {
              nextOffset = Math.max(
                nextOffset,
                update.update_id + 1
              );
              continue;
            }

            const chatId = message.chat.id;
            const text = String(message.text || "").trim();
            const hash = ownerHash(chatId);

            if (!owner) {
              if (text.startsWith("/start")) {
                owner = hash;

                await fs.writeFile(
                  ownerFile,
                  owner,
                  "utf8"
                );

                await send(
                  chatId,
                  "✅ Nikitin Browser Agent подключён.\n\n" +
                  "Теперь отправьте ссылку или команду, например:\n" +
                  "/open https://example.com\n" +
                  "/shot https://example.com\n" +
                  "/text https://example.com\n\n" +
                  "Следующий этап — подключим AI для команд обычным языком."
                );
              }

              nextOffset = Math.max(
                nextOffset,
                update.update_id + 1
              );

              continue;
            }

            if (hash !== owner) {
              nextOffset = Math.max(
                nextOffset,
                update.update_id + 1
              );
              continue;
            }

            if (text.startsWith("/start")) {
              await send(
                chatId,
                "✅ Агент уже подключён."
              );

              nextOffset = Math.max(
                nextOffset,
                update.update_id + 1
              );

              continue;
            }

            if (text.startsWith("/help")) {
              await send(
                chatId,
                "Команды:\n\n" +
                "/open URL — открыть сайт\n" +
                "/shot URL — открыть и прислать скриншот\n" +
                "/text URL — получить текст страницы\n\n" +
                "Можно также просто прислать URL."
              );

              nextOffset = Math.max(
                nextOffset,
                update.update_id + 1
              );

              continue;
            }

            if (!text) {
              nextOffset = Math.max(
                nextOffset,
                update.update_id + 1
              );
              continue;
            }

            await fs.writeFile(
              pendingFile,
              JSON.stringify(
                {
                  chat_id: chatId,
                  text,
                  update_id: update.update_id
                },
                null,
                2
              ),
              "utf8"
            );

            await send(
              chatId,
              "⏳ Задачу получил. Запускаю браузер."
            );

            nextOffset = update.update_id + 1;
            pending = true;

            break;
          }

          await fs.writeFile(
            offsetFile,
            String(nextOffset),
            "utf8"
          );

          if (process.env.GITHUB_OUTPUT) {
            await fs.appendFile(
              process.env.GITHUB_OUTPUT,
              `pending=${pending ? "true" : "false"}\n`
            );
          }
          EOF

          cat > src/execute-task.js <<'EOF'
          import { chromium } from "playwright";
          import fs from "node:fs/promises";

          const token = process.env.TELEGRAM_BOT_TOKEN;
          const pendingFile = ".state/pending.json";

          async function telegram(method, body) {
            const response = await fetch(
              `https://api.telegram.org/bot${token}/${method}`,
              {
                method: "POST",
                headers: {
                  "content-type": "application/json"
                },
                body: JSON.stringify(body)
              }
            );

            const data = await response.json();

            if (!data.ok) {
              throw new Error(
                data.description || "Telegram API error"
              );
            }

            return data.result;
          }

          async function send(chatId, text) {
            await telegram("sendMessage", {
              chat_id: chatId,
              text,
              disable_web_page_preview: true
            });
          }

          async function sendPhoto(chatId, filePath, caption) {
            const bytes = await fs.readFile(filePath);

            const form = new FormData();

            form.append(
              "chat_id",
              String(chatId)
            );

            form.append(
              "caption",
              caption.slice(0, 1000)
            );

            form.append(
              "photo",
              new Blob([bytes], {
                type: "image/png"
              }),
              "browser.png"
            );

            const response = await fetch(
              `https://api.telegram.org/bot${token}/sendPhoto`,
              {
                method: "POST",
                body: form
              }
            );

            const data = await response.json();

            if (!data.ok) {
              throw new Error(
                data.description || "Telegram photo error"
              );
            }
          }

          function extractUrl(text) {
            const match = text.match(
              /https?:\/\/[^\s<>"']+/i
            );

            if (!match) return null;

            return match[0]
              .replace(/[),.;]+$/, "");
          }

          const pending = JSON.parse(
            await fs.readFile(
              pendingFile,
              "utf8"
            )
          );

          const chatId = pending.chat_id;
          const task = String(pending.text || "");

          const url = extractUrl(task);

          if (!url) {
            await send(
              chatId,
              "Сейчас браузерная часть уже работает, но для этого режима нужна ссылка.\n\n" +
              "Например:\n/open https://example.com\n\n" +
              "Следом подключим AI, и можно будет ставить задачи обычным языком."
            );

            await fs.rm(
              pendingFile,
              { force: true }
            );

            process.exit(0);
          }

          let browser;

          try {
            browser = await chromium.launch({
              headless: true
            });

            const context =
              await browser.newContext({
                viewport: {
                  width: 1280,
                  height: 900
                }
              });

            const page =
              await context.newPage();

            await page.goto(url, {
              waitUntil: "domcontentloaded",
              timeout: 45000
            });

            await page.waitForTimeout(1500);

            const title =
              (await page.title()) ||
              "Без заголовка";

            const currentUrl =
              page.url();

            const bodyText =
              await page.locator("body")
                .innerText()
                .catch(() => "");

            const cleanText =
              bodyText
                .replace(/\s+/g, " ")
                .trim()
                .slice(0, 3000);

            const screenshot =
              "/tmp/browser-agent.png";

            await page.screenshot({
              path: screenshot,
              fullPage: false
            });

            const mode =
              task.startsWith("/text")
                ? "text"
                : task.startsWith("/shot")
                  ? "shot"
                  : "open";

            if (mode === "text") {
              await send(
                chatId,
                `✅ Страница открыта\n\n` +
                `${title}\n${currentUrl}\n\n` +
                `${cleanText || "Текст страницы не найден."}`
              );
            } else {
              await send(
                chatId,
                `✅ Страница открыта\n\n` +
                `${title}\n${currentUrl}`
              );

              await sendPhoto(
                chatId,
                screenshot,
                `${title}\n${currentUrl}`
              );
            }
          } catch (error) {
            await send(
              chatId,
              "❌ Браузер не смог выполнить задачу.\n\n" +
              String(
                error?.message ||
                error
              ).slice(0, 1500)
            );
          } finally {
            if (browser) {
              await browser.close()
                .catch(() => {});
            }

            await fs.rm(
              pendingFile,
              { force: true }
            );
          }
          EOF

      - name: Install npm dependencies
        run: npm install

      - name: Check Telegram
        id: poll
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: npm run poll

      - name: Install Chromium
        if: steps.poll.outputs.pending == 'true'
        run: npx playwright install --with-deps chromium

      - name: Execute browser task
        if: steps.poll.outputs.pending == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run agent

      - name: Save agent state and source
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -f .state/pending.json

          git add package.json package-lock.json src/ .state/

          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Update Telegram browser agent state [skip ci]"
            git push
          fi
