name: Nikitin Browser Agent

on:
  push:
    branches: [main]
    paths: [".github/workflows/bootstrap.yml"]

  workflow_dispatch:
    inputs:
      payload:
        description: "Encrypted Telegram task"
        required: false
        type: string
      kind:
        description: "browser or maintenance"
        required: false
        default: "browser"
        type: string

permissions:
  contents: write

jobs:
  deploy:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.payload == '')
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail

          R="$(curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            https://api.cloudflare.com/client/v4/accounts)"

          ID="$(printf '%s' "$R" | jq -r '.result[0].id // empty')"

          if [ -z "$ID" ]; then
            echo "Cloudflare account ID not found."
            exit 1
          fi

          echo "CLOUDFLARE_ACCOUNT_ID=$ID" >> "$GITHUB_ENV"

      - name: Ensure persistent state KV
        shell: bash
        run: |
          set -euo pipefail

          TITLE="nikitin-browser-agent-state"

          R="$(curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces?per_page=100")"

          KV_ID="$(printf '%s' "$R" | jq -r \
            --arg title "$TITLE" \
            '.result[] | select(.title == $title) | .id' | head -n 1)"

          if [ -z "$KV_ID" ]; then
            C="$(curl -fsS \
              -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "$(jq -n --arg title "$TITLE" '{title:$title}')" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces")"

            KV_ID="$(printf '%s' "$C" | jq -r '.result.id // empty')"
          fi

          if [ -z "$KV_ID" ]; then
            echo "KV namespace could not be resolved or created."
            exit 1
          fi

          echo "STATE_KV_ID=$KV_ID" >> "$GITHUB_ENV"

      - name: Generate grant-ready browser agent
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p worker/src src

          jq -n \
            --arg kv "$STATE_KV_ID" \
            '{
              "$schema":"node_modules/wrangler/config-schema.json",
              "name":"nikitin-browser-bridge",
              "main":"worker/src/index.js",
              "compatibility_date":"2026-10-05",
              "workers_dev":true,
              "ai":{"binding":"AI"},
              "kv_namespaces":[{"binding":"STATE","id":$kv}]
            }' > wrangler.jsonc

          cat > /tmp/worker.b64 <<'EOF'
          H4sIAE+rw2oC/+Vc644bx5X+z6coNYQsuSKbHFm2FWon2pE0kmYtaQYz43UMacwpkkWyNX3h9mVm
