      - name: Save generated source
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            worker/src/index.js \
            wrangler.jsonc \
            src/execute-dispatch.js \
            src/repo-update.js

          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Add persistent grant-ready browser agent [skip ci]"
            git push
          fi

      - name: Deploy Cloudflare Worker
        run: |
          npx --yes wrangler@4.147.0 deploy \
            --config wrangler.jsonc

      - name: Configure Worker secrets
        shell: bash
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail

          OWNER_HASH="$(cat .state/owner.hash)"
          WEBHOOK_SECRET="$(openssl rand -hex 32)"

          echo "::add-mask::$WEBHOOK_SECRET"

          printf '%s' "$GH_PAT" |
            npx --yes wrangler@4.147.0 secret put \
              GH_PAT --config wrangler.jsonc

          printf '%s' "$TELEGRAM_BOT_TOKEN" |
            npx --yes wrangler@4.147.0 secret put \
              TELEGRAM_BOT_TOKEN --config wrangler.jsonc

          printf '%s' "$OWNER_HASH" |
            npx --yes wrangler@4.147.0 secret put \
              OWNER_HASH --config wrangler.jsonc

          printf '%s' "$WEBHOOK_SECRET" |
            npx --yes wrangler@4.147.0 secret put \
              WEBHOOK_SECRET --config wrangler.jsonc

          printf '%s' "$GITHUB_REPOSITORY" |
            npx --yes wrangler@4.147.0 secret put \
              GITHUB_REPO --config wrangler.jsonc

          echo "WEBHOOK_SECRET=$WEBHOOK_SECRET" >> "$GITHUB_ENV"

      - name: Resolve Worker URL
        shell: bash
        run: |
          set -euo pipefail

          R="$(curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain")"

          SUB="$(printf '%s' "$R" | jq -r '.result.subdomain // empty')"

          if [ -z "$SUB" ]; then
            echo "workers.dev subdomain not found."
            exit 1
          fi

          echo "WORKER_URL=https://nikitin-browser-bridge.${SUB}.workers.dev" \
            >> "$GITHUB_ENV"

      - name: Configure Telegram webhook
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail

          P="$(jq -n \
            --arg url "${WORKER_URL}/telegram" \
            --arg secret "$WEBHOOK_SECRET" \
            '{
              url:$url,
              secret_token:$secret,
              allowed_updates:["message"],
              drop_pending_updates:false
            }')"

          R="$(curl -sS \
            -X POST \
            -H "Content-Type: application/json" \
            -d "$P" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook")"

          printf '%s' "$R" | jq -e '.ok == true' >/dev/null || {
            echo "Telegram setWebhook failed."
            exit 1
          }

          curl -fsS \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getWebhookInfo" |
            jq '{
              ok,
              url:.result.url,
              pending_update_count:.result.pending_update_count,
              last_error_message:.result.last_error_message
            }'

      - name: Verify bridge, AI and persistent state
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail

          R="$(curl -fsS "${WORKER_URL}/health")"

          printf '%s' "$R" |
            jq -e '.ok == true and .ai == true and .state == true' >/dev/null

          AI_KEY="$(
            printf 'browser-ai:%s' "$TELEGRAM_BOT_TOKEN" |
              sha256sum |
              awk '{print $1}'
          )"

          echo "::add-mask::$AI_KEY"

          TEST_VALUE="$(openssl rand -hex 16)"
          echo "::add-mask::$TEST_VALUE"

          curl -fsS \
            -X PUT \
            -H "Content-Type: application/json" \
            -H "X-Agent-Key: $AI_KEY" \
            -d "$(jq -n \
              --arg key "health_test" \
              --arg value "$TEST_VALUE" \
              '{key:$key,value:$value}')" \
            "${WORKER_URL}/state" |
            jq -e '.ok == true' >/dev/null

          S="$(curl -fsS \
            -H "X-Agent-Key: $AI_KEY" \
            "${WORKER_URL}/state?key=health_test")"

          printf '%s' "$S" |
            jq -e --arg value "$TEST_VALUE" \
              '.ok == true and .value == $value' >/dev/null

          BODY='{
            "task":"Для теста сразу заверши задачу и ответь OK.",
            "state":{
              "url":"https://example.com/",
              "title":"Test",
              "text":"Test page",
              "elements":[],
              "forms":[],
              "confirmed":false,
              "attachments":[]
            },
            "history":[]
          }'

          A="$(curl -fsS \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-Agent-Key: $AI_KEY" \
            -d "$BODY" \
            "${WORKER_URL}/ai")"

          printf '%s' "$A" |
            jq -e '.ok == true and .decision.action != null' >/dev/null

          echo "Bridge + Workers AI + persistent KV state OK"

  browser:
    if: github.event_name == 'workflow_dispatch' && inputs.payload != '' && inputs.kind != 'maintenance'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: |
          npx playwright install \
            --with-deps chromium

      - name: Execute browser agent
        env:
          BRIDGE_PAYLOAD: ${{ inputs.payload }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FPG_LOGIN: ${{ secrets.FPG_LOGIN }}
          FPG_PASSWORD: ${{ secrets.FPG_PASSWORD }}
        run: |
          node src/execute-dispatch.js

  maintenance:
    if: github.event_name == 'workflow_dispatch' && inputs.payload != '' && inputs.kind == 'maintenance'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate and commit bootstrap update
        env:
          BRIDGE_PAYLOAD: ${{ inputs.payload }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          node src/repo-update.js
