name: Memorial58 PDF Audit
on:
  push:
    branches: [main]
    paths: [".github/workflows/memorial58-pdf-audit.yml"]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: "npm"}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Extract memorial58 document links
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage();
          await page.goto("https://memorial58.ru/",{waitUntil:"domcontentloaded",timeout:45000});
          await page.waitForTimeout(2500);
          const out=await page.evaluate(()=>{
            const html=document.documentElement.outerHTML;
            const pdfs=[...new Set((html.match(/[^"'\s<>]+\.pdf(?:\?[^"'\s<>]*)?/gi)||[]))];
            const els=[...document.querySelectorAll("*")].filter(el=>{
              const t=String(el.innerText||el.textContent||"").replace(/\s+/g," ").trim();
              return t && t.length<220 && /(Альфа|Администрации города Пензы|Правительства Пензенской области|Росгвард|УФСИН|ФСБ|Управление образования|Законодатель)/i.test(t);
            }).map(el=>({
              tag:el.tagName.toLowerCase(),text:String(el.innerText||el.textContent||"").replace(/\s+/g," ").trim(),
              attrs:Object.fromEntries([...el.attributes].map(a=>[a.name,a.value]).filter(([k,v])=>/href|src|data|onclick/i.test(k)||/pdf/i.test(v))),
              outer:String(el.outerHTML||"").slice(0,1200)
            })).slice(0,100);
            return {url:location.href,title:document.title,pdfs,els};
          });
          const fn=await page.evaluate(()=>typeof openFile==="function"?openFile.toString():"NO_OPENFILE"); console.log("MEM58_JSON "+JSON.stringify({...out,openFile:fn}));
          const targets=["Альфа.pdf","Пенза.pdf","Правительство.pdf","служба.pdf","Администрации.pdf","БФ.pdf","Собрание.pdf","УФСИН.pdf","ФСБ.pdf","управление образования.pdf","Обоснование.pdf"];
          for(const name of targets){
            const u=new URL("files/"+name,"https://memorial58.ru/").href;
            try{
              const resp=await fetch(u); const buf=Buffer.from(await resp.arrayBuffer());
              const p="/tmp/"+name.replace(/[^a-zA-Z0-9А-Яа-я._-]/g,"_");
              await (await import("node:fs/promises")).writeFile(p,buf);
              console.log("MEM58_PDF "+JSON.stringify({name,url:u,status:resp.status,bytes:buf.length,path:p}));
              if(resp.ok && buf.length>1000){
                const {execFileSync}=await import("node:child_process");
                try{
                  const txt=execFileSync("pdftotext",["-layout",p,"-"],{encoding:"utf8",maxBuffer:8*1024*1024});
                  console.log("MEM58_TEXT "+JSON.stringify({name,text:txt.slice(0,10000)}));
                }catch(e){console.log("MEM58_TEXT_ERR "+name+" "+String(e?.message||e));}
              }
            }catch(e){console.log("MEM58_PDF_ERR "+name+" "+String(e?.message||e));}
          }
          await browser.close();
          NODE
