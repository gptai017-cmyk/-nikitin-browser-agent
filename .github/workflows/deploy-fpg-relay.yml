name: Deploy Temporary FPG Relay
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-fpg-relay.yml"
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Write relay worker
        run: |
          cat > /tmp/fpg-relay.js <<'JS'
          export default {
            async fetch(request) {
              const u = new URL(request.url);
              const target = new URL("https://xn--80afcdbalict6afooklqi5o.xn--p1ai/");
              const testPath = u.searchParams.get("path") || "/";
              target.pathname = testPath;
              target.search = "";
              try {
                const r = await fetch(target.toString(), {
                  redirect: "manual",
                  headers: {
                    "user-agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36",
                    "accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
                  }
                });
                const body = await r.text();
                return new Response(JSON.stringify({
                  ok: true,
                  target: target.toString(),
                  status: r.status,
                  location: r.headers.get("location"),
                  server: r.headers.get("server"),
                  content_type: r.headers.get("content-type"),
                  body_head: body.slice(0, 500)
                }), {
                  status: 200,
                  headers: {"content-type":"application/json; charset=utf-8","cache-control":"no-store"}
                });
              } catch (e) {
                return new Response(JSON.stringify({ok:false,error:String(e?.message||e)}),{
                  status:502,headers:{"content-type":"application/json; charset=utf-8","cache-control":"no-store"}
                });
              }
            }
          };
          JS
      - name: Deploy relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ead717e4aeccf34fc50aa3832f12221f
        run: |
          npx --yes wrangler@4.41.0 deploy /tmp/fpg-relay.js --name nikitin-fpg-relay-temp --compatibility-date 2026-10-11
      - name: Test relay
        run: |
          sleep 3
          curl -fsS --max-time 30 'https://nikitin-fpg-relay-temp.cbd-legal-cloudflare-worker.workers.dev/?path=/application/about-project' | head -c 2000
