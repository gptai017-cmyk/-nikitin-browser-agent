name: FPG team and organization read-only audit
on:
  push:
    branches: [main]
    paths: [".github/workflows/fpg-team-org-audit.yml"]
permissions:
  contents: read
jobs:
  team:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install chromium
      - name: Inspect team fields
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FPG_LOGIN: ${{ secrets.FPG_LOGIN }}
          FPG_PASSWORD: ${{ secrets.FPG_PASSWORD }}
          BROWSER_BRIDGE_URL: "https://nikitin-browser-bridge.cbd-legal-cloudflare-worker.workers.dev"
          BROWSER_TASK_PLAINTEXT: '[[BROWSER_SCOPE:GRANT]] DIRECT_JSON:{"url":"https://xn--80afcdbalict6afooklqi5o.xn--p1ai/application/about-project?applicationId=8546be37-971f-4a0f-ba12-af9876ee6d0f","actions":[{"op":"click_text","value":"Команда","exact":false,"wait_ms":2000},{"op":"inspect_team_gaps"},{"op":"inspect_team_cards"}]}'
        shell: bash
        run: |
          set +e
          node src/execute-dispatch.js > /tmp/fpg-team.log 2>&1
          RC=$?
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const s=fs.readFileSync("/tmp/fpg-team.log","utf8");
          const i=s.indexOf("DIRECT_JSON_OUTPUT_V1");
          console.log("FPG_TEAM_AUDIT "+(i>=0?s.slice(i,i+21000):s.slice(-1400)).replace(/https?:\/\/[^\s]+/g,"[url]"));
          NODE
          echo "EXIT=$RC"
          test "$RC" -eq 0
  org:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install chromium
      - name: Inspect org fields
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FPG_LOGIN: ${{ secrets.FPG_LOGIN }}
          FPG_PASSWORD: ${{ secrets.FPG_PASSWORD }}
          BROWSER_BRIDGE_URL: "https://nikitin-browser-bridge.cbd-legal-cloudflare-worker.workers.dev"
          BROWSER_TASK_PLAINTEXT: '[[BROWSER_SCOPE:GRANT]] DIRECT_JSON:{"url":"https://xn--80afcdbalict6afooklqi5o.xn--p1ai/application/about-project?applicationId=8546be37-971f-4a0f-ba12-af9876ee6d0f","actions":[{"op":"click_text","value":"Организация","exact":false,"wait_ms":2000},{"op":"inspect_org_completion"},{"op":"inspect_org_gaps","start":0},{"op":"inspect_org_gaps","start":35}]}'
        shell: bash
        run: |
          set +e
          node src/execute-dispatch.js > /tmp/fpg-org.log 2>&1
          RC=$?
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const s=fs.readFileSync("/tmp/fpg-org.log","utf8");
          const i=s.indexOf("DIRECT_JSON_OUTPUT_V1");
          console.log("FPG_ORG_AUDIT "+(i>=0?s.slice(i,i+21000):s.slice(-1400)).replace(/https?:\/\/[^\s]+/g,"[url]"));
          NODE
          echo "EXIT=$RC"
          test "$RC" -eq 0
